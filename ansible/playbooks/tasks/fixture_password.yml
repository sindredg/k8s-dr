---
# SOPS reads the age key from SOPS_AGE_KEY_FILE, which the Makefile sets.
- name: Decrypt the fixture password
  ansible.builtin.command:
    argv:
      - sops
      - --decrypt
      - --extract
      - '["fixture_password"]'
      - "{{ fixture_repo_root }}/recovery/fixtures.sops.yaml"
  register: fixture_password
  changed_when: false
  no_log: true
