---
# Creates the recovery fixtures in recovery/fixtures.yaml through the public
# HTTPS endpoint, then runs the read-only checks. Safe to re-run: each fixture
# that already exists is skipped.
- name: Create the recovery fixtures
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../../recovery/fixtures.yaml
    - vars/fixtures.yml
  tasks:
    - name: Show the endpoint under test
      ansible.builtin.debug:
        msg: "{{ fixture_user }}/{{ fixture_repository }} on https://{{ git_host }}/"

    - name: Read the fixture password
      ansible.builtin.import_tasks: tasks/fixture_password.yml

    - name: Decrypt the Gitea administrator password
      ansible.builtin.command:
        argv:
          - sops
          - --decrypt
          - --extract
          - '["stringData"]["password"]'
          - "{{ fixture_repo_root }}/deploy/apps/gitea/admin.sops.yaml"
      register: create_fixture_admin_password
      changed_when: false
      no_log: true

    - name: Look up the fixture user
      ansible.builtin.uri:
        url: "{{ fixture_api }}/users/{{ fixture_user }}"
        url_username: gitea-admin
        url_password: "{{ create_fixture_admin_password.stdout }}"
        force_basic_auth: true
        status_code: [200, 404]
      register: create_fixture_user_lookup
      no_log: true

    - name: Create the fixture user
      ansible.builtin.uri:
        url: "{{ fixture_api }}/admin/users"
        method: POST
        url_username: gitea-admin
        url_password: "{{ create_fixture_admin_password.stdout }}"
        force_basic_auth: true
        body_format: json
        body:
          username: "{{ fixture_user }}"
          email: "{{ fixture_email }}"
          password: "{{ fixture_password.stdout }}"
          must_change_password: false
        status_code: 201
      register: create_fixture_user
      when: create_fixture_user_lookup.status == 404
      changed_when: true
      no_log: true

    - name: Look up the fixture repository
      ansible.builtin.uri:
        url: "{{ fixture_api }}/repos/{{ fixture_user }}/{{ fixture_repository }}"
        url_username: "{{ fixture_user }}"
        url_password: "{{ fixture_password.stdout }}"
        force_basic_auth: true
        status_code: [200, 404]
      register: create_fixture_repository_lookup
      no_log: true

    # Empty and private: the fixture commit is the root commit, and reading
    # it requires the fixture user's sign-in.
    - name: Create the fixture repository
      ansible.builtin.uri:
        url: "{{ fixture_api }}/user/repos"
        method: POST
        url_username: "{{ fixture_user }}"
        url_password: "{{ fixture_password.stdout }}"
        force_basic_auth: true
        body_format: json
        body:
          name: "{{ fixture_repository }}"
          private: true
          auto_init: false
          default_branch: "{{ fixture_branch }}"
        status_code: 201
      register: create_fixture_repository
      when: create_fixture_repository_lookup.status == 404
      changed_when: true
      no_log: true

    - name: Look up the default branch
      ansible.builtin.uri:
        url: >-
          {{ fixture_api }}/repos/{{ fixture_user }}/{{ fixture_repository
          }}/branches/{{ fixture_branch }}
        url_username: "{{ fixture_user }}"
        url_password: "{{ fixture_password.stdout }}"
        force_basic_auth: true
        status_code: [200, 404]
      register: create_fixture_branch_lookup
      no_log: true

    - name: Push the fixture commit
      when: create_fixture_branch_lookup.status == 404
      block:
        - name: Create a temporary repository directory
          ansible.builtin.tempfile:
            state: directory
            suffix: .fixture
          register: create_fixture_workdir

        - name: Build the fixture commit
          ansible.builtin.command:
            argv:
              - "{{ ansible_playbook_python }}"
              - "{{ fixture_repo_root }}/scripts/fixture_commit.py"
              - --fixtures
              - "{{ fixture_repo_root }}/recovery/fixtures.yaml"
              - --directory
              - "{{ create_fixture_workdir.path }}"
          register: create_fixture_built_sha
          changed_when: false

        - name: Require the recorded commit SHA
          ansible.builtin.assert:
            that: create_fixture_built_sha.stdout == fixture_commit.sha
            fail_msg: >-
              Built {{ create_fixture_built_sha.stdout }}, but recovery/fixtures.yaml
              records {{ fixture_commit.sha }}
            quiet: true

        - name: Push the fixture commit over HTTPS
          ansible.builtin.command:
            argv:
              - "{{ fixture_git }}"
              - -C
              - "{{ create_fixture_workdir.path }}"
              - push
              - --quiet
              - "{{ fixture_clone_url }}"
              - "{{ fixture_branch }}:{{ fixture_branch }}"
            stdin: "{{ fixture_password.stdout }}"
          register: create_fixture_push
          changed_when: create_fixture_push.rc == 0
          failed_when: false
          no_log: true

        - name: Record when the push was accepted
          ansible.builtin.set_fact:
            create_fixture_pushed: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"

        - name: Require the push to succeed
          ansible.builtin.assert:
            that: create_fixture_push.rc == 0
            fail_msg: >-
              git push exited {{ create_fixture_push.rc }}:
              {{ create_fixture_push.stderr }}
            quiet: true
      always:
        - name: Remove the temporary repository
          ansible.builtin.file:
            path: "{{ create_fixture_workdir.path }}"
            state: absent
          when: create_fixture_workdir.path is defined

    - name: List the repository issues
      ansible.builtin.uri:
        url: >-
          {{ fixture_api }}/repos/{{ fixture_user }}/{{ fixture_repository
          }}/issues?state=all&type=issues&limit=50
        url_username: "{{ fixture_user }}"
        url_password: "{{ fixture_password.stdout }}"
        force_basic_auth: true
      register: create_fixture_issue_lookup
      no_log: true

    - name: Create the fixture issue
      ansible.builtin.uri:
        url: "{{ fixture_api }}/repos/{{ fixture_user }}/{{ fixture_repository }}/issues"
        method: POST
        url_username: "{{ fixture_user }}"
        url_password: "{{ fixture_password.stdout }}"
        force_basic_auth: true
        body_format: json
        body:
          title: "{{ fixture_issue.title }}"
          body: The recovery checks require this issue.
        status_code: 201
      register: create_fixture_issue
      when: >-
        create_fixture_issue_lookup.json
        | selectattr('title', 'equalto', fixture_issue.title) | list | length == 0
      changed_when: true
      no_log: true

    - name: Require the recorded issue number
      ansible.builtin.assert:
        that: create_fixture_issue.json.number == fixture_issue.number
        fail_msg: >-
          Created issue #{{ create_fixture_issue.json.number }}, but
          recovery/fixtures.yaml records #{{ fixture_issue.number }}
        quiet: true
      when: create_fixture_issue is not skipped

    # Record these times in the milestone worklog.
    - name: Report what this run created
      ansible.builtin.debug:
        msg:
          - >-
            User: {{ 'created ' ~ create_fixture_user.json.created
            if create_fixture_user is not skipped else 'already present' }}
          - >-
            Repository: {{ 'created ' ~ create_fixture_repository.json.created_at
            if create_fixture_repository is not skipped else 'already present' }}
          - >-
            Commit {{ fixture_commit.sha }}: {{ 'push accepted ' ~ create_fixture_pushed
            if create_fixture_pushed is defined else 'branch already present' }}
          - >-
            Issue #{{ fixture_issue.number }}: {{ 'created ' ~ create_fixture_issue.json.created_at
            if create_fixture_issue is not skipped else 'already present' }}

- name: Check the recovery fixtures
  ansible.builtin.import_playbook: check_fixtures.yml
