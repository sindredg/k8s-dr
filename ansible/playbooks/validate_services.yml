---
# Read-only checks of the Flux-owned service layer. Run after
# validate_cluster.yml passes.
- name: Collect read-only service validation evidence
  hosts: kube_control_plane
  gather_facts: false
  become: true
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  tasks:
    - name: Wait for the Flux service Kustomizations
      ansible.builtin.command: >-
        kubectl wait --for=condition=Ready kustomization/{{ item }}
        --namespace flux-system --timeout=600s
      loop:
        - infrastructure
        - certificates
        - postgresql
        - gitea
      changed_when: false

    - name: Wait for the Helm releases
      ansible.builtin.command: >-
        kubectl wait --for=condition=Ready helmrelease/{{ item }}
        --namespace {{ item }} --timeout=300s
      loop:
        - cert-manager
        - gitea
      changed_when: false

    - name: Wait for the ACME accounts of both issuers
      ansible.builtin.command: >-
        kubectl wait --for=condition=Ready clusterissuer/{{ item }} --timeout=180s
      loop:
        - letsencrypt-staging
        - letsencrypt-production
      changed_when: false

    # A first DNS-01 order waits for Cloudflare propagation.
    - name: Wait for the Gitea certificates
      ansible.builtin.command: >-
        kubectl wait --for=condition=Ready certificate/{{ item }}
        --namespace gitea --timeout=600s
      loop:
        - git-tls
        - git-cluster-tls
      changed_when: false

    - name: Show the Gitea certificate issuers, names, and expiry
      ansible.builtin.command: >-
        kubectl get certificates --namespace gitea
        --output=custom-columns=NAME:.metadata.name,ISSUER:.spec.issuerRef.name,NAMES:.spec.dnsNames,EXPIRES:.status.notAfter
      changed_when: false

    - name: Wait for PostgreSQL
      ansible.builtin.command: >-
        kubectl rollout status statefulset/postgresql --namespace postgresql --timeout=300s
      changed_when: false

    - name: Wait for Gitea
      ansible.builtin.command: >-
        kubectl rollout status deployment/gitea --namespace gitea --timeout=300s
      changed_when: false

    - name: Require the data volumes to be bound
      ansible.builtin.command: >-
        kubectl get persistentvolumeclaim/{{ item.name }} --namespace {{ item.namespace }}
        --output=jsonpath={.status.phase}
      loop:
        - {namespace: postgresql, name: data-postgresql-0}
        - {namespace: gitea, name: gitea-shared-storage}
      register: validate_data_pvc
      changed_when: false
      failed_when: validate_data_pvc.stdout != "Bound"

    - name: Wait for the Gitea Gateway to be programmed
      ansible.builtin.command: >-
        kubectl wait --for=condition=Programmed gateway/gitea
        --namespace gitea --timeout=180s
      changed_when: false

    # Each route attaches to the listener for git_host and the listener for
    # git_cluster_host, so it reports one status per listener.
    - name: Require both Gitea routes to be accepted
      ansible.builtin.command: >-
        kubectl get httproute {{ item }} --namespace gitea
        --output=jsonpath='{.status.parents[*].conditions[?(@.type=="Accepted")].status}'
      loop:
        - gitea
        - gitea-https-redirect
      register: validate_gitea_route
      changed_when: false
      until: validate_gitea_route.stdout == "True True"
      retries: 30
      delay: 5

    - name: List the network policies
      ansible.builtin.command: >-
        kubectl get networkpolicies --namespace {{ item }} --output=name
      loop:
        - postgresql
        - gitea
      register: validate_network_policies
      changed_when: false
      failed_when: >-
        'networkpolicy.networking.k8s.io/default-deny'
        not in validate_network_policies.stdout_lines

    - name: Read the Gitea hostnames from the cluster settings
      ansible.builtin.command: >-
        kubectl get configmap/cluster-settings --namespace flux-system
        --output=jsonpath={.data.{{ item }}}
      loop:
        - git_host
        - git_cluster_host
      register: validate_git_hosts
      changed_when: false
      failed_when: validate_git_hosts.stdout == ""

    # The requests travel from the control plane to Traefik's private
    # NodePort, so they exercise the HTTP listeners and the redirect route.
    - name: Require the HTTP listeners to redirect to HTTPS
      ansible.builtin.uri:
        url: >-
          http://{{ hostvars[groups['kube_workers'] | first].node_internal_ip
          }}:{{ traefik_http_node_port }}/
        method: GET
        headers:
          Host: "{{ item }}"
        follow_redirects: none
        status_code: 301
      loop: "{{ validate_git_hosts.results | map(attribute='stdout') | list }}"
      register: validate_redirect
      changed_when: false
      failed_when: >-
        validate_redirect.status != 301 or
        not validate_redirect.location.startswith('https://' ~ item ~ '/')
