---
# Plays that run kubectl or helm read the administrative kubeconfig from
# KUBECONFIG, so tasks do not repeat --kubeconfig.
- name: Bootstrap Kubernetes nodes
  hosts: kube_cluster
  gather_facts: true
  become: true
  roles:
    - node_prepare
    - container_runtime
    - kubernetes_packages

- name: Prepare dedicated worker storage
  hosts: kube_workers
  gather_facts: false
  become: true
  roles:
    - worker_storage

- name: Initialize the Kubernetes control plane
  hosts: kube_control_plane
  gather_facts: false
  become: true
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  roles:
    - control_plane

- name: Join Kubernetes workers
  hosts: kube_workers
  gather_facts: false
  become: true
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  roles:
    - worker_join

- name: Install pinned cluster add-ons
  hosts: kube_control_plane
  gather_facts: false
  become: true
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  roles:
    - cluster_addons

- name: Install Flux and connect it to the Git repository
  hosts: kube_control_plane
  gather_facts: false
  become: true
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  roles:
    - flux
