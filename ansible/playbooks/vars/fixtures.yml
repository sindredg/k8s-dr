---
# Shared by the fixture playbooks, which run on the operator machine against
# the public HTTPS endpoint. Pass -e git_host=<host> to check another endpoint,
# such as the recovery host, or -e git_url=<url> for a URL with another scheme
# or port, such as a port-forward to the test restore.
fixture_repo_root: "{{ playbook_dir | dirname | dirname }}"
# The cluster whose settings give the default host. The Makefile passes
# CLUSTER.
fixture_cluster: primary
git_host: >-
  {{ (lookup('ansible.builtin.file', fixture_repo_root ~ '/deploy/clusters/'
  ~ fixture_cluster ~ '/cluster-settings.yaml') | from_yaml).data.git_host }}
git_url: "https://{{ git_host }}"
fixture_api: "{{ git_url }}/api/v1"
fixture_clone_url: >-
  {{ git_url | replace('://', '://' ~ fixture_user ~ '@', 1) }}/{{ fixture_user
  }}/{{ fixture_repository }}.git
# Reads the password from stdin; see the script.
fixture_git: "{{ fixture_repo_root }}/scripts/git_with_password.sh"
ansible_python_interpreter: "{{ ansible_playbook_python }}"
