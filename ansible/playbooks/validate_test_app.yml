---
# Checks for the disposable milestone 2 application. Run after
# deploy_test_app.yml and validate_cluster.yml.
- name: Collect read-only test application evidence
  hosts: kube_control_plane
  gather_facts: false
  become: true
  tasks:
    - name: Wait for the test application after restart
      ansible.builtin.command: >-
        kubectl --kubeconfig /etc/kubernetes/admin.conf
        rollout status deployment/milestone2-app
        --namespace milestone2-test --timeout=300s
      changed_when: false

    - name: Wait for the Gateway to be programmed
      ansible.builtin.command: >-
        kubectl --kubeconfig /etc/kubernetes/admin.conf
        wait --for=condition=Programmed gateway/milestone2-gateway
        --namespace milestone2-test --timeout=180s
      changed_when: false

    - name: Require the HTTPRoute to be accepted
      ansible.builtin.command: >-
        kubectl --kubeconfig /etc/kubernetes/admin.conf
        get httproute milestone2-route --namespace milestone2-test
        --output=jsonpath='{.status.parents[*].conditions[?(@.type=="Accepted")].status}'
      register: validate_route_accepted
      changed_when: false
      until: validate_route_accepted.stdout == "True"
      retries: 30
      delay: 5

    - name: Require the application PVC to be bound
      ansible.builtin.command: >-
        kubectl --kubeconfig /etc/kubernetes/admin.conf
        get persistentvolumeclaim milestone2-content --namespace milestone2-test
        --output=jsonpath={.status.phase}
      register: validate_pvc_phase
      changed_when: false
      failed_when: validate_pvc_phase.stdout != "Bound"

    - name: Read the application PVC
      ansible.builtin.command: >-
        kubectl --kubeconfig /etc/kubernetes/admin.conf
        get persistentvolumeclaims --namespace milestone2-test --output=wide
      changed_when: false

    - name: Read cluster persistent volumes
      ansible.builtin.command: >-
        kubectl --kubeconfig /etc/kubernetes/admin.conf
        get persistentvolumes --output=wide
      changed_when: false

    - name: Read application pod placement
      ansible.builtin.command: >-
        kubectl --kubeconfig /etc/kubernetes/admin.conf
        get pods --namespace milestone2-test --output=wide
      changed_when: false

    # Requests travel from the control plane to the worker's private address,
    # so they exercise Calico, kube-proxy, the Traefik NodePort, and the route.
    - name: Request the application through the Gateway route
      ansible.builtin.uri:
        url: >-
          http://{{ hostvars[groups['kube_workers'] | first].node_internal_ip
          }}:{{ traefik_http_node_port }}/
        method: GET
        headers:
          Host: milestone2.local
        return_content: true
        status_code: 200
      register: validate_app_response
      changed_when: false
      failed_when: >-
        validate_app_response.status != 200 or
        'milestone2 persistent marker' not in validate_app_response.content

    - name: Confirm the route rejects requests without the application host
      ansible.builtin.uri:
        url: >-
          http://{{ hostvars[groups['kube_workers'] | first].node_internal_ip
          }}:{{ traefik_http_node_port }}/
        method: GET
        status_code: 404
      changed_when: false
