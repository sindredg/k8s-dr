---
apiVersion: v1
kind: Namespace
metadata:
  name: milestone2-test
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: milestone2-content
  namespace: milestone2-test
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 64Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: milestone2-app
  namespace: milestone2-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: milestone2-app
  template:
    metadata:
      labels:
        app: milestone2-app
    spec:
      nodeSelector:
        node-role.kubernetes.io/worker: ""
      initContainers:
        - name: write-marker
          image: busybox:1.37.0
          command:
            - sh
            - -c
            - >-
              chmod 0755 /data &&
              (test -f /data/index.html ||
              echo 'milestone2 persistent marker' > /data/index.html)
          volumeMounts:
            - name: content
              mountPath: /data
      containers:
        - name: nginx
          image: nginx:1.28.0-alpine3.21
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: content
              mountPath: /usr/share/nginx/html
              readOnly: true
      volumes:
        - name: content
          persistentVolumeClaim:
            claimName: milestone2-content
---
apiVersion: v1
kind: Service
metadata:
  name: milestone2-app
  namespace: milestone2-test
spec:
  type: ClusterIP
  selector:
    app: milestone2-app
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: milestone2-gateway
  namespace: milestone2-test
spec:
  gatewayClassName: traefik
  listeners:
    - name: web
      protocol: HTTP
      port: 8000
      hostname: milestone2.local
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: milestone2-route
  namespace: milestone2-test
spec:
  parentRefs:
    - name: milestone2-gateway
      sectionName: web
  hostnames:
    - milestone2.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: milestone2-app
          port: 80
