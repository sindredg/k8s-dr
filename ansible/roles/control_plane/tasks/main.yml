---
- name: Render the kubeadm initialization configuration
  ansible.builtin.template:
    src: kubeadm-init.yml.j2
    dest: /etc/kubernetes/kubeadm-init.yml
    owner: root
    group: root
    mode: "0600"

- name: Validate the kubeadm initialization configuration
  ansible.builtin.command: >-
    kubeadm config validate --config /etc/kubernetes/kubeadm-init.yml
  changed_when: false

- name: Check whether the control plane is initialized
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  register: control_plane_admin_config

- name: Pre-pull control-plane images
  ansible.builtin.command: >-
    kubeadm config images pull --config /etc/kubernetes/kubeadm-init.yml
  when: not control_plane_admin_config.stat.exists
  changed_when: true

- name: Initialize the control plane
  ansible.builtin.command: >-
    kubeadm init --config /etc/kubernetes/kubeadm-init.yml
  when: not control_plane_admin_config.stat.exists
  changed_when: true

- name: Protect the administrative kubeconfig
  ansible.builtin.file:
    path: /etc/kubernetes/admin.conf
    state: file
    owner: root
    group: root
    mode: "0600"

- name: Wait for the Kubernetes API readiness endpoint
  ansible.builtin.command: >-
    kubectl --kubeconfig /etc/kubernetes/admin.conf get --raw=/readyz
  register: control_plane_readyz
  changed_when: false
  failed_when: false
  retries: 30
  delay: 2
  until: control_plane_readyz.rc == 0

- name: Collect verbose API readiness diagnostics
  ansible.builtin.command: >-
    kubectl --kubeconfig /etc/kubernetes/admin.conf get --raw=/readyz?verbose
  register: control_plane_readyz_diagnostics
  changed_when: false
  failed_when: false
  when: control_plane_readyz.rc != 0

- name: Collect kubelet diagnostics  # noqa command-instead-of-module
  # The systemd module does not return journal-style status diagnostics.
  ansible.builtin.command: >-
    systemctl --no-pager --full status kubelet
  register: control_plane_kubelet_diagnostics
  changed_when: false
  failed_when: false
  when: control_plane_readyz.rc != 0

- name: Stop when an initialized control plane is unhealthy
  ansible.builtin.fail:
    msg: >-
      Kubernetes API readiness failed. readyz output:
      {{ control_plane_readyz_diagnostics.stdout | default('unavailable') }};
      kubelet status:
      {{ control_plane_kubelet_diagnostics.stdout | default('unavailable') }}
  when: control_plane_readyz.rc != 0
