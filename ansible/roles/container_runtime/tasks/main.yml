---
- name: Install the pinned containerd package
  ansible.builtin.apt:
    name: "containerd={{ containerd_deb_version }}"
    state: present
    allow_downgrade: true
    update_cache: true

- name: Create the containerd configuration directory
  ansible.builtin.file:
    path: /etc/containerd
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure containerd for Kubernetes
  ansible.builtin.template:
    src: config.toml.j2
    dest: /etc/containerd/config.toml
    owner: root
    group: root
    mode: "0644"

- name: Validate containerd configuration
  ansible.builtin.command: containerd --config /etc/containerd/config.toml config dump
  changed_when: false

- name: Enable and start containerd
  ansible.builtin.service:
    name: containerd
    enabled: true
    state: started

# Compare on every run. A handler would be lost if a later task failed after the
# configuration changed, leaving containerd on its package defaults.
- name: Read the containerd configuration timestamp
  ansible.builtin.stat:
    path: /etc/containerd/config.toml
  register: container_runtime_config

- name: Read the containerd start time  # noqa command-instead-of-module
  # The systemd module does not return the start time as a Unix timestamp.
  ansible.builtin.command: >-
    systemctl show containerd --property=ActiveEnterTimestamp
    --timestamp=unix --value
  register: container_runtime_started
  changed_when: false

- name: Restart containerd with the current configuration
  ansible.builtin.service:
    name: containerd
    state: restarted
  when: >-
    (container_runtime_started.stdout | regex_replace('^@', '') | int)
    < container_runtime_config.stat.mtime

- name: Wait for the containerd socket
  ansible.builtin.wait_for:
    path: /run/containerd/containerd.sock
    state: present
    timeout: 30
