---
name: Recover

# Runs make recover on a GitHub-hosted runner. The job signs in to Google
# Cloud through workload identity federation as the pipeline account; no
# service account key exists. The environment allows main only, and
# infra/shared/pipeline.tf accepts no other ref. A rerun resumes at the stage
# that failed, from the run state kept in the Terraform state bucket. See
# decision 0013 and docs/runbooks/regional-recovery.md.
"on":
  workflow_dispatch:
    inputs:
      through:
        description: >-
          Stop after this stage. verification rehearses without the fence
          and the cutover.
        type: choice
        default: all
        options:
          - all
          - preflight
          - provisioning
          - bootstrap
          - flux-reconcile
          - restore
          - verification
          - fence
          - dns-cutover
          - probe-recovery
      reset:
        description: Archive the state of an earlier run and start again at preflight.
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

# One recovery at a time. GitHub keeps one pending run per group: a newer
# dispatch replaces a pending one, which never starts.
concurrency:
  group: recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-24.04
    environment: recovery
    timeout-minutes: 120
    env:
      # The environment's secrets are masked in the public log.
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      CLOUDSDK_CORE_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      STATE_BUCKET: ${{ secrets.STATE_BUCKET }}
      BACKUP_BUCKET: ${{ secrets.BACKUP_BUCKET }}
      ADMIN_MEMBER: ${{ secrets.ADMIN_MEMBER }}
      RECOVERY_READER_MEMBER: ${{ secrets.RECOVERY_READER_MEMBER }}
      RECOVERY_SUBNET_CIDR: ${{ vars.RECOVERY_SUBNET_CIDR }}
      DRILL_DIR: .drill
      ANSIBLE_HOME: ansible/.cache
      XDG_CACHE_HOME: ansible/.cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        # No pip cache: this job holds both age keys, and a cache entry is
        # written by other workflows.
        with:
          python-version: "3.13"
      - run: python -m pip install -r ansible/requirements.txt
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_version: "1.16.6"
          terraform_wrapper: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db  # v3.0.1
        with:
          version: "589.0.0"
      # The preflight and the fixture playbooks need sops, age, and dig.
      - name: Install sops, age, and dig
        env:
          SOPS_VERSION: "3.13.3"
          SOPS_SHA256: e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b
          AGE_VERSION: "1.3.2"
          AGE_SHA256: cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bind9-dnsutils
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSLo "$RUNNER_TEMP/bin/sops" \
            "https://github.com/getsops/sops/releases/download/v$SOPS_VERSION/sops-v$SOPS_VERSION.linux.amd64"
          echo "$SOPS_SHA256  $RUNNER_TEMP/bin/sops" | sha256sum -c
          chmod +x "$RUNNER_TEMP/bin/sops"
          curl -sSLo "$RUNNER_TEMP/age.tar.gz" \
            "https://github.com/FiloSottile/age/releases/download/v$AGE_VERSION/age-v$AGE_VERSION-linux-amd64.tar.gz"
          echo "$AGE_SHA256  $RUNNER_TEMP/age.tar.gz" | sha256sum -c
          tar -xzf "$RUNNER_TEMP/age.tar.gz" -C "$RUNNER_TEMP/bin" --strip-components=1 \
            age/age age/age-keygen
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: python3 scripts/pipeline.py configure
      - run: >-
          python3 scripts/pipeline.py keys --sops-key "$RUNNER_TEMP/keys/age.agekey"
          --backup-key "$RUNNER_TEMP/keys/backup.agekey"
      - run: python3 scripts/pipeline.py ssh-key
      - run: python3 scripts/pipeline.py pull --drill-dir "$DRILL_DIR"
      - if: inputs.reset
        run: python3 scripts/recover.py --drill-dir "$DRILL_DIR" reset
      - name: make recover
        env:
          THROUGH: ${{ inputs.through }}
        run: |
          args=""
          if [ "$THROUGH" != all ]; then
            args="--through $THROUGH"
          fi
          make recover BIN= DRILL_DIR="$DRILL_DIR" RECOVER_ARGS="$args" \
            FLUX_AGE_KEY_FILE="$RUNNER_TEMP/keys/age.agekey" \
            BACKUP_AGE_KEY_FILE="$RUNNER_TEMP/keys/backup.agekey"
      # Saved whether the run passed or failed, so a rerun resumes.
      - if: always()
        run: python3 scripts/pipeline.py push --drill-dir "$DRILL_DIR"
      - if: always()
        run: |
          if [ -f "$DRILL_DIR/timeline.tsv" ]; then
            python3 scripts/drill_report.py --drill-dir "$DRILL_DIR" timeline \
              >> "$GITHUB_STEP_SUMMARY"
          fi
