---
name: Pins

# Upstream repositories can drop a pinned version after it was validated.
# The weekly run finds that before a recovery bootstrap does.
"on":
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pins:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ansible/requirements.txt
      - run: python -m pip install -r ansible/requirements.txt
      - run: python scripts/check_pins.py
