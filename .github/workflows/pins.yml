---
name: Pins

# Upstream repositories can drop a pinned version after it was validated.
# The weekly run finds that before a recovery bootstrap does.
"on":
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ansible/requirements.txt
      - run: python -m pip install -r ansible/requirements.txt
      - run: python scripts/check_pins.py
