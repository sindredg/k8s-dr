---
name: Ansible

"on":
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  ANSIBLE_HOME: ansible/.cache
  XDG_CACHE_HOME: ansible/.cache

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ansible/requirements.txt
      - run: python -m pip install -r ansible/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: yamllint -c ansible/.yamllint.yml ansible .github/workflows/ansible.yml
      - run: ansible-lint ansible
      - run: ansible-playbook -i 'localhost,' --syntax-check ansible/playbooks/bootstrap.yml
