---
name: Ansible

"on":
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  ANSIBLE_HOME: ansible/.cache
  XDG_CACHE_HOME: ansible/.cache

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ansible/requirements.txt
      - run: python -m pip install -r ansible/requirements.txt
      - run: make check BIN=
      - name: Install kubeconform
        env:
          KUBECONFORM_URL: https://github.com/yannh/kubeconform/releases/download/v0.8.0
          KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
        run: |
          curl -sSLO "$KUBECONFORM_URL/kubeconform-linux-amd64.tar.gz"
          echo "$KUBECONFORM_SHA256  kubeconform-linux-amd64.tar.gz" | sha256sum -c
          tar -xzf kubeconform-linux-amd64.tar.gz -C "$RUNNER_TEMP" kubeconform
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: make manifests BIN=
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
      - run: terraform -chdir=infra/bootstrap init -backend=false -input=false
      - run: terraform -chdir=infra/bootstrap validate -no-color
      - run: terraform -chdir=infra/shared init -backend=false -input=false
      - run: terraform -chdir=infra/shared validate -no-color
      - run: terraform -chdir=infra/primary init -backend=false -input=false
      - run: terraform -chdir=infra/primary validate -no-color
      - run: terraform -chdir=infra/recovery init -backend=false -input=false
      - run: terraform -chdir=infra/recovery validate -no-color
