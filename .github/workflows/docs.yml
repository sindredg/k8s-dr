---
name: Docs

"on":
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Check Markdown files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          errors = []
          for file in Path(".").rglob("*.md"):
              if ".git" in file.parts:
                  continue

              text = file.read_text()
              if not text.endswith("\n"):
                  errors.append(f"{file}: missing final newline")

              for number, line in enumerate(text.splitlines(), 1):
                  if line.rstrip() != line:
                      errors.append(f"{file}:{number}: trailing whitespace")

              for target in re.findall(r"\[[^\]]+\]\(([^)]+)\)", text):
                  path = target.partition("#")[0]
                  if path and "://" not in path and not path.startswith("mailto:"):
                      if not (file.parent / path).exists():
                          errors.append(f"{file}: broken local link: {target}")

          if errors:
              print("\n".join(errors))
              sys.exit(1)
          print("Markdown checks passed")
          PY
