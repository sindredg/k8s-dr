---
name: Pipeline setup
description: >-
  Install the recovery toolchain, sign in as the pipeline account through
  workload identity federation, and read both age keys from Secret Manager.
  The Recover, Return, and Drill workflows share it, so all pin the same
  tools. See decision 0013.

inputs:
  workload_identity_provider:
    description: The workload identity provider of the pipeline account.
    required: true
  service_account:
    description: The pipeline account email.
    required: true

runs:
  using: composite
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      # No pip cache: this job holds both age keys, and a cache entry is
      # written by other workflows.
      with:
        python-version: "3.13"
    - shell: bash
      run: python -m pip install -r ansible/requirements.txt
    - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
      with:
        terraform_version: "1.16.6"
        terraform_wrapper: false
    - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3.0.0
      with:
        workload_identity_provider: ${{ inputs.workload_identity_provider }}
        service_account: ${{ inputs.service_account }}
    - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db  # v3.0.1
      with:
        version: "589.0.0"
    # The preflight and the fixture playbooks need sops, age, dig, and jq.
    - name: Install sops, age, dig, and jq
      shell: bash
      env:
        SOPS_VERSION: "3.13.3"
        SOPS_SHA256: e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b
        AGE_VERSION: "1.3.2"
        AGE_SHA256: cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10
      run: |
        sudo apt-get update
        sudo apt-get install --yes --no-install-recommends bind9-dnsutils jq
        mkdir -p "$RUNNER_TEMP/bin"
        curl -sSLo "$RUNNER_TEMP/bin/sops" \
          "https://github.com/getsops/sops/releases/download/v$SOPS_VERSION/sops-v$SOPS_VERSION.linux.amd64"
        echo "$SOPS_SHA256  $RUNNER_TEMP/bin/sops" | sha256sum -c
        chmod +x "$RUNNER_TEMP/bin/sops"
        curl -sSLo "$RUNNER_TEMP/age.tar.gz" \
          "https://github.com/FiloSottile/age/releases/download/v$AGE_VERSION/age-v$AGE_VERSION-linux-amd64.tar.gz"
        echo "$AGE_SHA256  $RUNNER_TEMP/age.tar.gz" | sha256sum -c
        tar -xzf "$RUNNER_TEMP/age.tar.gz" -C "$RUNNER_TEMP/bin" --strip-components=1 \
          age/age age/age-keygen
        echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
    - shell: bash
      run: python3 scripts/pipeline.py configure
    - shell: bash
      run: >-
        python3 scripts/pipeline.py keys --sops-key "$RUNNER_TEMP/keys/age.agekey"
        --backup-key "$RUNNER_TEMP/keys/backup.agekey"
    - shell: bash
      run: python3 scripts/pipeline.py ssh-key
