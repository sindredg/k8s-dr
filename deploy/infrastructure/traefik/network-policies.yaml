---
# Traefik is the only pod the internet reaches. Limit what it can open
# connections to: DNS, the Kubernetes API, and Gitea. That excludes the
# metadata server, the kubelets, and the internet. Ingress stays open, because
# public traffic arrives on the host ports with the client address. Ansible
# creates the namespace with the Traefik release. See decision 0010.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: traefik-egress
  namespace: traefik
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # The API server is reached on its node address after the Service
    # translates it, so the rule allows port 6443 by port.
    - ports:
        - protocol: TCP
          port: 6443
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gitea
          podSelector:
            matchLabels:
              app.kubernetes.io/name: gitea
      ports:
        - protocol: TCP
          port: 3000
