---
# Traefik (Ansible-owned) serves this Gateway on its web (8000) and websecure
# (8443) entry points, which the worker exposes as host ports 80 and 443.
# The certificate Secret is in this namespace, so no ReferenceGrant is needed.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gitea
  namespace: gitea
spec:
  gatewayClassName: traefik
  listeners:
    - name: http
      protocol: HTTP
      port: 8000
      hostname: ${git_host}
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 8443
      hostname: ${git_host}
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: git-tls
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gitea-https-redirect
  namespace: gitea
spec:
  parentRefs:
    - name: gitea
      sectionName: http
  hostnames:
    - ${git_host}
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gitea
  namespace: gitea
spec:
  parentRefs:
    - name: gitea
      sectionName: https
  hostnames:
    - ${git_host}
  rules:
    - backendRefs:
        - name: gitea-http
          port: 3000
