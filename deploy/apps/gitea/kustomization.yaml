---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - admin.sops.yaml
  - database.sops.yaml
  - repository.yaml
  - release.yaml
  - gateway.yaml
  - network-policies.yaml
  - backup.sops.yaml
  - backup.yaml
configMapGenerator:
  - name: gitea-backup
    # This Kustomization sets no default namespace.
    namespace: gitea
    files:
      - backup/backup.sh
      - backup/recipients.txt
generatorOptions:
  # Keep Flux from substituting the shell variables in the script.
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
