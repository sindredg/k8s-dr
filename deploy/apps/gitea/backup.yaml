---
# Hourly consistent backup of PostgreSQL and the Gitea volume to the offsite
# bucket. See decision 0007 and backup/backup.sh.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitea-backup
  namespace: gitea
---
# Scale Gitea to zero for the capture and back up afterwards.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gitea-backup
  namespace: gitea
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["gitea"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    resourceNames: ["gitea"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitea-backup
  namespace: gitea
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gitea-backup
subjects:
  - kind: ServiceAccount
    name: gitea-backup
    namespace: gitea
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: gitea-backup
  namespace: gitea
spec:
  # Flux substitutes a bare true or false from the cluster settings.
  suspend: ${backup_suspend}
  schedule: "7 * * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # A retry would start a new set; the next hourly run is the retry.
      backoffLimit: 0
      activeDeadlineSeconds: 1800
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: gitea-backup
        spec:
          serviceAccountName: gitea-backup
          restartPolicy: Never
          # The Gitea volume is local to the worker disk.
          nodeSelector:
            node-role.kubernetes.io/worker: ""
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              # yamllint disable-line rule:line-length
              image: ghcr.io/sindredg/k8s-dr-backup@sha256:275f4646e3f15bfcd28486c170cf6d3a2d19b3d43ce328c985462cf59bd2a1a7
              command: ["/backup/backup.sh"]
              env:
                - name: BACKUP_CLUSTER
                  value: ${backup_cluster}
                - name: BACKUP_BUCKET
                  valueFrom:
                    secretKeyRef:
                      name: gitea-backup
                      key: bucket
                - name: PING_URL
                  valueFrom:
                    secretKeyRef:
                      name: gitea-backup
                      key: ping_url
                - name: PGHOST
                  value: postgresql.postgresql.svc.cluster.local
                - name: PGUSER
                  value: gitea
                - name: PGDATABASE
                  value: gitea
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: gitea-database
                      key: password
                - name: HOME
                  value: /tmp
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: data
                  mountPath: /data
                  readOnly: true
                - name: staging
                  mountPath: /staging
                - name: tmp
                  mountPath: /tmp
                - name: backup
                  mountPath: /backup
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: gitea-shared-storage
                readOnly: true
            - name: staging
              emptyDir:
                sizeLimit: 4Gi
            - name: tmp
              emptyDir:
                sizeLimit: 64Mi
            - name: backup
              configMap:
                name: gitea-backup
                defaultMode: 0555
