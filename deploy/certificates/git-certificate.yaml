---
# The Gitea Gateway listeners in deploy/apps/gitea reference these Secrets.
# Each cluster sets git_host, git_cluster_host, and git_issuer in its
# cluster-settings ConfigMap. One certificate per name keeps each within the
# Let's Encrypt limit for an exact set of names. See decision 0008.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: git-tls
  namespace: gitea
spec:
  secretName: git-tls
  dnsNames:
    - ${git_host}
  issuerRef:
    kind: ClusterIssuer
    name: ${git_issuer}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: git-cluster-tls
  namespace: gitea
spec:
  secretName: git-cluster-tls
  dnsNames:
    - ${git_cluster_host}
  issuerRef:
    kind: ClusterIssuer
    name: ${git_issuer}
