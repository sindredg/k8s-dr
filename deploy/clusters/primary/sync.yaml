---
# Controllers and their CRDs. Later Kustomizations depend on this one.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./deploy/infrastructure
  prune: true
  wait: true
  timeout: 5m
---
# Issuers, the Cloudflare token, and this cluster's certificates. wait is off
# so that a slow Let's Encrypt order cannot fail the bootstrap; validation
# checks the Certificate separately.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: certificates
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./deploy/clusters/primary/certificates
  prune: true
  wait: false
  timeout: 5m
  decryption:
    provider: sops
    secretRef:
      name: sops-age
