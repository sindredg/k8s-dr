---
# Flux applies this directory as the flux-system Kustomization on a recovery
# cluster. Ansible creates that Kustomization; see ansible/roles/flux.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - cluster-settings.yaml
  - ../../sync
# The recovery's certificates come from certificates/ and read the run's name
# from certificate-settings, which Git never defines. Absent, it defines
# nothing; present, it wins. See decision 0016.
patches:
  - target:
      group: kustomize.toolkit.fluxcd.io
      kind: Kustomization
      name: certificates
    patch: |-
      - op: replace
        path: /spec/path
        value: ./deploy/clusters/recovery/certificates
      - op: add
        path: /spec/postBuild/substituteFrom/-
        value:
          kind: ConfigMap
          name: certificate-settings
          optional: true
