<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 424" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="adr0005-bootstrap-flow-title adr0005-bootstrap-flow-desc" id="adr0005-bootstrap-flow-root">
        <title id="adr0005-bootstrap-flow-title">Bootstrap data and credential flow</title>
        <desc id="adr0005-bootstrap-flow-desc">Architecture diagram showing the bootstrap flow: Terraform outputs become the generated inventory, the operator&#x27;s identity opens IAP SSH tunnels, the Ansible controller configures both VMs, the control plane issues a short-lived join token to the worker, and the add-ons use the dedicated worker disk.</desc>
        <defs>
      <style>#adr0005-bootstrap-flow-root { --color-paper:   #2d3142;
      --color-ink:     #f5f5f5;
      --color-muted:   #bfc0c0;
      --color-accent:  #f08a59;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #adr0005-bootstrap-flow-root { font-family: var(--font-sans); color: var(--color-ink); }
      #adr0005-bootstrap-flow-root .diagram-container { width: 100%; overflow-x: auto; }
      #adr0005-bootstrap-flow-root .diagram-container { overflow-x: visible; }</style>
          <marker id="adr0005-bootstrap-flow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker>
          <marker id="adr0005-bootstrap-flow-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker>
          <marker id="adr0005-bootstrap-flow-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#739fdf"/></marker>
          
        </defs>

        <rect width="100%" height="100%" fill="#2d3142"/>

        <!-- zones -->


        <!-- rules, lifelines and callouts -->


        <!-- connectors (behind nodes) -->
        <path d="M 184,88 L 216,88" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#adr0005-bootstrap-flow-arrow)"/>
        <path d="M 184,296 L 216,296" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#adr0005-bootstrap-flow-arrow)"/>
        <path d="M 360,88 L 372,88 Q 380,88 380,96 L 380,172 Q 380,180 388,180 L 400,180" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#adr0005-bootstrap-flow-arrow)"/>
        <path d="M 360,296 L 372,296 Q 380,296 380,288 L 380,212 Q 380,204 388,204 L 400,204" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#adr0005-bootstrap-flow-arrow)"/>
        <path d="M 544,180 L 564,180 Q 572,180 572,172 L 572,96 Q 572,88 580,88 L 600,88" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#adr0005-bootstrap-flow-arrow)"/>
        <path d="M 544,204 L 564,204 Q 572,204 572,212 L 572,288 Q 572,296 580,296 L 600,296" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#adr0005-bootstrap-flow-arrow)"/>
        <path d="M 672,120 L 672,264" fill="none" stroke="#f08a59" stroke-width="1.4" marker-end="url(#adr0005-bootstrap-flow-arrow-accent)"/>
        <path d="M 744,88 L 776,88" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#adr0005-bootstrap-flow-arrow)"/>
        <path d="M 848,264 L 848,120" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#adr0005-bootstrap-flow-arrow)"/>

        <!-- connector labels -->
        <rect x="680" y="186" width="80" height="12" rx="2" fill="#2d3142"/>
        <text x="720" y="195" fill="#f08a59" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">JOIN · 15 MIN</text>
        <rect x="776" y="218" width="64" height="12" rx="2" fill="#2d3142"/>
        <text x="808" y="227" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">LOCAL PATH</text>

        <!-- nodes -->
        <!-- node: Terraform outputs -->
        <rect x="40" y="56" width="144" height="64" rx="6" fill="#2d3142"/>
        <rect x="40" y="56" width="144" height="64" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
        <text x="112" y="79" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Terraform outputs</text>
        <text x="112" y="94" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">names · addresses</text>
        <text x="112" y="107" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">project · zone</text>
        <!-- node: Inventory -->
        <rect x="216" y="56" width="144" height="64" rx="6" fill="#2d3142"/>
        <rect x="216" y="56" width="144" height="64" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
        <text x="288" y="79" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Inventory</text>
        <text x="288" y="94" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">generated, ignored</text>
        <text x="288" y="107" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">127.0.0.1 + port</text>
        <!-- node: Operator identity -->
        <rect x="40" y="264" width="144" height="64" rx="6" fill="#2d3142"/>
        <rect x="40" y="264" width="144" height="64" rx="6" fill="#bfc0c0" fill-opacity="0.10" stroke="#949eb2" stroke-width="1"/>
        <text x="112" y="287" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Operator identity</text>
        <text x="112" y="302" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">gcloud</text>
        <text x="112" y="315" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">OS Login</text>
        <!-- node: IAP SSH tunnels -->
        <rect x="216" y="264" width="144" height="64" rx="6" fill="#2d3142"/>
        <rect x="216" y="264" width="144" height="64" rx="6" fill="#f5f5f5" fill-opacity="0.03" stroke="#f5f5f5" stroke-opacity="0.30" stroke-width="1"/>
        <text x="288" y="293.5" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">IAP SSH tunnels</text>
        <text x="288" y="308.5" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">one per node</text>
        <!-- node: Ansible -->
        <rect x="400" y="160" width="144" height="64" rx="6" fill="#2d3142"/>
        <rect x="400" y="160" width="144" height="64" rx="6" fill="#f08a59" fill-opacity="0.10" stroke="#f08a59" stroke-width="1"/>
        <text x="472" y="183" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Ansible</text>
        <text x="472" y="198" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">controller on the</text>
        <text x="472" y="211" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">operator machine</text>
        <!-- node: Control-plane VM -->
        <rect x="600" y="56" width="144" height="64" rx="6" fill="#2d3142"/>
        <rect x="600" y="56" width="144" height="64" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
        <text x="672" y="79" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Control-plane VM</text>
        <text x="672" y="94" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">kubeadm init</text>
        <text x="672" y="107" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Kubernetes API</text>
        <!-- node: Worker VM -->
        <rect x="600" y="264" width="144" height="64" rx="6" fill="#2d3142"/>
        <rect x="600" y="264" width="144" height="64" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
        <text x="672" y="293.5" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Worker VM</text>
        <text x="672" y="308.5" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">kubeadm join</text>
        <!-- node: Cluster add-ons -->
        <rect x="776" y="56" width="144" height="64" rx="6" fill="#2d3142"/>
        <rect x="776" y="56" width="144" height="64" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
        <text x="848" y="72.5" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Cluster add-ons</text>
        <text x="848" y="87.5" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Calico · Traefik</text>
        <text x="848" y="100.5" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Gateway API CRDs</text>
        <text x="848" y="113.5" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Local Path</text>
        <!-- node: Worker data disk -->
        <rect x="776" y="264" width="144" height="64" rx="6" fill="#2d3142"/>
        <rect x="776" y="264" width="144" height="64" rx="6" fill="#f5f5f5" fill-opacity="0.05" stroke="#bfc0c0" stroke-width="1"/>
        <text x="848" y="293.5" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Worker data disk</text>
        <text x="848" y="308.5" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">dedicated</text>

        <!-- legend strip -->
        <line x1="40" y1="356" x2="920" y2="356" stroke="#f5f5f5" stroke-opacity="0.10" stroke-width="0.8"/>
