        <text x="60" y="396" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Credentials</text>
        <rect x="140" y="388" width="14" height="10" rx="2" fill="#f5f5f5" fill-opacity="0.03" stroke="#f5f5f5" stroke-opacity="0.30" stroke-width="1"/>
        <text x="160" y="396" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Google service</text>
        <rect x="256" y="388" width="14" height="10" rx="2" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
        <text x="276" y="396" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Generated or built</text>
        <rect x="392" y="388" width="14" height="10" rx="2" fill="#f08a59" fill-opacity="0.10" stroke="#f08a59" stroke-width="1"/>
        <text x="412" y="396" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Runs the playbook</text>
        <rect x="520" y="388" width="14" height="10" rx="2" fill="#f5f5f5" fill-opacity="0.05" stroke="#bfc0c0" stroke-width="1"/>
        <text x="540" y="396" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Disk</text>
        <line x1="584" y1="393" x2="612" y2="393" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#adr0005-bootstrap-flow-arrow)"/>
        <text x="620" y="396" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Feeds</text>
        <line x1="672" y1="393" x2="700" y2="393" stroke="#f08a59" stroke-width="1.4" marker-end="url(#adr0005-bootstrap-flow-arrow-accent)"/>
        <text x="708" y="396" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Short-lived secret</text>
      </svg>
