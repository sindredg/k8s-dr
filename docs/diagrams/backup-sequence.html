<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>One backup run</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #2d3142;
      --color-ink:     #f5f5f5;
      --color-muted:   #bfc0c0;
      --color-accent:  #f08a59;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · k8s-dr</p>
    <h1>One backup run</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 684" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="backup-sequence-title backup-sequence-desc">
        <title id="backup-sequence-title">One backup run</title>
        <desc id="backup-sequence-desc">Sequence diagram showing one backup run while Gitea keeps running: ping the heartbeat, create an LVM snapshot of the worker data volume and bind its volume directories, dump the database from a temporary server on the snapshot and archive the Gitea volume with age encryption, upload both archives and then the manifest, ping success, and remove the snapshot.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#739fdf"/></marker>
          
        </defs>

        <rect width="100%" height="100%" fill="#2d3142"/>

        <!-- zones -->


        <!-- rules, lifelines and callouts -->
        <line x1="112" y1="96" x2="112" y2="520" stroke="rgba(245,245,245,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="296" y1="96" x2="296" y2="520" stroke="rgba(245,245,245,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="480" y1="96" x2="480" y2="520" stroke="rgba(245,245,245,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="664" y1="96" x2="664" y2="520" stroke="rgba(245,245,245,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="848" y1="96" x2="848" y2="520" stroke="rgba(245,245,245,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <text x="920" y="552" fill="#bfc0c0" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif" text-anchor="end"><tspan x="920" dy="0">Gitea keeps running. The filesystem freezes only while</tspan><tspan x="920" dy="17">the snapshot switches in, for milliseconds.</tspan></text>

        <!-- connectors (behind nodes) -->
        <path d="M 112,140 L 848,140" fill="none" stroke="#739fdf" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <path d="M 112,184 L 296,184" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 296,228 L 480,228" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 112,272 L 480,272" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 112,316 L 480,316" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 112,360 L 664,360" fill="none" stroke="#739fdf" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <path d="M 112,404 L 664,404" fill="none" stroke="#f08a59" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <path d="M 112,448 L 848,448" fill="none" stroke="#739fdf" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <path d="M 112,492 L 296,492" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- connector labels -->
        <rect x="172" y="120" width="64" height="12" rx="2" fill="#2d3142"/>
        <text x="204" y="129" fill="#739fdf" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">PING START</text>
        <rect x="158" y="164" width="92" height="12" rx="2" fill="#2d3142"/>
        <text x="204" y="173" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">CREATE SNAPSHOT</text>
        <rect x="324" y="208" width="128" height="12" rx="2" fill="#2d3142"/>
        <text x="388" y="217" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">MOUNT AND BIND VOLUMES</text>
        <rect x="132" y="252" width="144" height="12" rx="2" fill="#2d3142"/>
        <text x="204" y="261" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">PG_DUMP, ENCRYPT WITH AGE</text>
        <rect x="148" y="296" width="112" height="12" rx="2" fill="#2d3142"/>
        <text x="204" y="305" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">TAR VOLUME, ENCRYPT</text>
        <rect x="146" y="340" width="116" height="12" rx="2" fill="#2d3142"/>
        <text x="204" y="349" fill="#739fdf" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">UPLOAD BOTH ARCHIVES</text>
        <rect x="132" y="384" width="144" height="12" rx="2" fill="#2d3142"/>
        <text x="204" y="393" fill="#f08a59" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">UPLOAD MANIFEST.JSON LAST</text>
        <rect x="166" y="428" width="76" height="12" rx="2" fill="#2d3142"/>
        <text x="204" y="437" fill="#739fdf" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">PING SUCCESS</text>
        <rect x="152" y="472" width="104" height="12" rx="2" fill="#2d3142"/>
        <text x="204" y="481" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">REMOVE ON SIGTERM</text>

        <!-- nodes -->
        <!-- node: Backup Pod -->
        <rect x="40" y="40" width="144" height="56" rx="6" fill="#2d3142"/>
        <rect x="40" y="40" width="144" height="56" rx="6" fill="rgba(240,138,89,0.10)" stroke="#f08a59" stroke-width="1"/>
        <text x="112" y="65.5" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Backup Pod</text>
        <text x="112" y="80.5" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">gitea-backup · worker</text>
        <!-- node: Worker host -->
        <rect x="224" y="40" width="144" height="56" rx="6" fill="#2d3142"/>
        <rect x="224" y="40" width="144" height="56" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
        <text x="296" y="65.5" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Worker host</text>
        <text x="296" y="80.5" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">k8sdr-snapshot</text>
        <!-- node: LVM snapshot -->
        <rect x="408" y="40" width="144" height="56" rx="6" fill="#2d3142"/>
        <rect x="408" y="40" width="144" height="56" rx="6" fill="rgba(245,245,245,0.05)" stroke="#bfc0c0" stroke-width="1"/>
        <text x="480" y="65.5" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">LVM snapshot</text>
        <text x="480" y="80.5" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">k8sdr/backup</text>
        <!-- node: Backup bucket -->
        <rect x="592" y="40" width="144" height="56" rx="6" fill="#2d3142"/>
        <rect x="592" y="40" width="144" height="56" rx="6" fill="rgba(245,245,245,0.05)" stroke="#bfc0c0" stroke-width="1"/>
        <text x="664" y="65.5" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Backup bucket</text>
        <text x="664" y="80.5" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">primary/&lt;UTC time&gt;/</text>
        <!-- node: Healthchecks.io -->
        <rect x="776" y="40" width="144" height="56" rx="6" fill="#2d3142"/>
        <rect x="776" y="40" width="144" height="56" rx="6" fill="rgba(245,245,245,0.03)" stroke="rgba(245,245,245,0.30)" stroke-width="1"/>
        <text x="848" y="65.5" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Healthchecks.io</text>
        <text x="848" y="80.5" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">heartbeat</text>

        <!-- legend strip -->
        <line x1="40" y1="616" x2="920" y2="616" stroke="rgba(245,245,245,0.10)" stroke-width="0.8"/>
        <text x="40" y="632" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">LEGEND</text>
        <rect x="40" y="648" width="14" height="10" rx="2" fill="rgba(240,138,89,0.10)" stroke="#f08a59" stroke-width="1"/>
        <text x="60" y="656" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">The Pod</text>
        <rect x="120" y="648" width="14" height="10" rx="2" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
        <text x="140" y="656" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Host</text>
        <rect x="200" y="648" width="14" height="10" rx="2" fill="rgba(245,245,245,0.05)" stroke="#bfc0c0" stroke-width="1"/>
        <text x="220" y="656" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Data</text>
        <rect x="264" y="648" width="14" height="10" rx="2" fill="rgba(245,245,245,0.03)" stroke="rgba(245,245,245,0.30)" stroke-width="1"/>
        <text x="284" y="656" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">External service</text>
        <line x1="388" y1="653" x2="416" y2="653" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="424" y="656" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Local call</text>
        <line x1="524" y1="653" x2="552" y2="653" stroke="#739fdf" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text x="560" y="656" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">HTTPS to outside</text>
        <line x1="664" y1="653" x2="692" y2="653" stroke="#f08a59" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="700" y="656" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Marks the set complete</text>
      </svg>
    </div>
  </div>
</body>
</html>
