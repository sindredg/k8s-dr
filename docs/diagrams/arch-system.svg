        <rect x="760" y="72" width="144" height="48" rx="6" fill="#2d3142"/>
        <rect x="760" y="72" width="144" height="48" rx="6" fill="#f5f5f5" fill-opacity="0.05" stroke="#bfc0c0" stroke-width="1"/>
        <text x="832" y="93.5" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">State bucket</text>
        <text x="832" y="108.5" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Terraform state</text>
        <!-- node: Recovery cluster -->
        <rect x="760" y="168" width="144" height="256" rx="6" fill="#2d3142"/>
        <rect x="760" y="168" width="144" height="256" rx="6" fill="#f5f5f5" fill-opacity="0.02" stroke="#f5f5f5" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="832" y="280.5" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Recovery cluster</text>
        <text x="832" y="295.5" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">built for a drill</text>
        <text x="832" y="308.5" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">or a disaster</text>
        <text x="832" y="321.5" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">same code</text>
        <!-- node: Backup bucket -->
        <rect x="760" y="536" width="144" height="64" rx="6" fill="#2d3142"/>
        <rect x="760" y="536" width="144" height="64" rx="6" fill="#f5f5f5" fill-opacity="0.05" stroke="#bfc0c0" stroke-width="1"/>
        <text x="832" y="565.5" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Backup bucket</text>
        <text x="832" y="580.5" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">encrypted sets</text>

