<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 712" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="arch-system-title arch-system-desc" id="arch-system-root">
        <title id="arch-system-title">The whole system</title>
        <desc id="arch-system-desc">Architecture diagram showing the operator machine or a GitHub Actions runner, GitHub, and Cloudflare DNS driving a primary cluster in Finland and an on-demand recovery cluster in Belgium, with the Terraform state bucket and the backup bucket in Belgium and monitoring held by external services.</desc>
        <defs>
      <style>#arch-system-root { --color-paper:   #2d3142;
      --color-ink:     #f5f5f5;
      --color-muted:   #bfc0c0;
      --color-accent:  #f08a59;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #arch-system-root { font-family: var(--font-sans); color: var(--color-ink); }
      #arch-system-root .diagram-container { width: 100%; overflow-x: auto; }
      #arch-system-root .diagram-container { overflow-x: visible; }</style>
          <marker id="arch-system-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker>
          <marker id="arch-system-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker>
          <marker id="arch-system-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#739fdf"/></marker>
          
        </defs>

        <rect width="100%" height="100%" fill="#2d3142"/>

        <!-- zones -->
        <rect x="200" y="136" width="192" height="304" rx="8" fill="#f5f5f5" fill-opacity="0.03" stroke="#f5f5f5" stroke-opacity="0.20" stroke-width="0.8" stroke-dasharray="4,4"/>
        <rect x="212" y="140" width="132" height="12" rx="2" fill="#2d3142"/>
        <text x="278" y="149" fill="#949eb2" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">GOOGLE CLOUD · FINLAND</text>
        <rect x="744" y="40" width="176" height="576" rx="8" fill="#f5f5f5" fill-opacity="0.03" stroke="#f5f5f5" stroke-opacity="0.20" stroke-width="0.8" stroke-dasharray="4,4"/>
        <rect x="756" y="44" width="132" height="12" rx="2" fill="#2d3142"/>
        <text x="822" y="53" fill="#949eb2" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">GOOGLE CLOUD · BELGIUM</text>

        <!-- rules, lifelines and callouts -->


        <!-- connectors (behind nodes) -->
        <path d="M 488,200 L 376,200" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arch-system-arrow)"/>
        <path d="M 648,200 L 760,200" fill="none" stroke="#bfc0c0" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arch-system-arrow)"/>
        <path d="M 568,168 L 568,104 Q 568,96 576,96 L 760,96" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arch-system-arrow)"/>
        <path d="M 488,296 L 376,296" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arch-system-arrow)"/>
        <path d="M 648,296 L 760,296" fill="none" stroke="#bfc0c0" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arch-system-arrow)"/>
        <path d="M 488,392 L 376,392" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arch-system-arrow)"/>
        <path d="M 648,392 L 760,392" fill="none" stroke="#bfc0c0" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arch-system-arrow)"/>
        <path d="M 568,472 L 568,424" fill="none" stroke="#739fdf" stroke-width="1.2" marker-end="url(#arch-system-arrow-link)"/>
        <path d="M 296,424 L 296,560 Q 296,568 304,568 L 760,568" fill="none" stroke="#f08a59" stroke-width="1.4" marker-end="url(#arch-system-arrow-accent)"/>
        <path d="M 832,536 L 832,424" fill="none" stroke="#f08a59" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arch-system-arrow-accent)"/>
        <path d="M 216,296 L 168,296" fill="none" stroke="#739fdf" stroke-width="1.2" marker-end="url(#arch-system-arrow-link)"/>

        <!-- connector labels -->
        <rect x="388" y="180" width="88" height="12" rx="2" fill="#2d3142"/>
        <text x="432" y="189" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">TERRAFORM, IAP</text>
        <rect x="662" y="76" width="36" height="12" rx="2" fill="#2d3142"/>
        <text x="680" y="85" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">STATE</text>
        <rect x="400" y="276" width="64" height="12" rx="2" fill="#2d3142"/>
        <text x="432" y="285" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">FLUX PULLS</text>
        <rect x="406" y="372" width="52" height="12" rx="2" fill="#2d3142"/>
        <text x="432" y="381" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">A RECORD</text>
        <rect x="664" y="372" width="80" height="12" rx="2" fill="#2d3142"/>
        <text x="704" y="381" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">AFTER CUTOVER</text>
        <rect x="482" y="548" width="76" height="12" rx="2" fill="#2d3142"/>
        <text x="520" y="557" fill="#f08a59" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">EVERY 15 MIN</text>
        <rect x="776" y="482" width="48" height="12" rx="2" fill="#2d3142"/>
        <text x="800" y="491" fill="#f08a59" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">RESTORE</text>

        <!-- nodes -->
        <!-- node: Monitoring -->
        <rect x="40" y="248" width="128" height="96" rx="6" fill="#2d3142"/>
        <rect x="40" y="248" width="128" height="96" rx="6" fill="#f5f5f5" fill-opacity="0.03" stroke="#f5f5f5" stroke-opacity="0.30" stroke-width="1"/>
        <text x="104" y="287" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Monitoring</text>
        <text x="104" y="302" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Grafana Cloud</text>
        <text x="104" y="315" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Healthchecks.io</text>
        <!-- node: Primary cluster -->
        <rect x="216" y="168" width="160" height="256" rx="6" fill="#2d3142"/>
        <rect x="216" y="168" width="160" height="256" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
        <text x="296" y="280.5" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Primary cluster</text>
        <text x="296" y="295.5" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">always running</text>
        <text x="296" y="308.5" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">2 VMs · kubeadm</text>
        <text x="296" y="321.5" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Gitea + PostgreSQL</text>
        <!-- node: Operator machine -->
        <rect x="488" y="168" width="160" height="64" rx="6" fill="#2d3142"/>
        <rect x="488" y="168" width="160" height="64" rx="6" fill="#bfc0c0" fill-opacity="0.10" stroke="#949eb2" stroke-width="1"/>
        <text x="568" y="191" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Operator or runner</text>
        <text x="568" y="206" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Terraform · make · Ansible</text>
        <text x="568" y="219" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">age private keys</text>
        <!-- node: GitHub -->
        <rect x="488" y="264" width="160" height="64" rx="6" fill="#2d3142"/>
        <rect x="488" y="264" width="160" height="64" rx="6" fill="#f5f5f5" fill-opacity="0.03" stroke="#f5f5f5" stroke-opacity="0.30" stroke-width="1"/>
        <text x="568" y="287" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">GitHub</text>
        <text x="568" y="302" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">k8s-dr repository</text>
        <text x="568" y="315" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Actions: CI, watchdog</text>
        <!-- node: Cloudflare DNS -->
        <rect x="488" y="360" width="160" height="64" rx="6" fill="#2d3142"/>
        <rect x="488" y="360" width="160" height="64" rx="6" fill="#f5f5f5" fill-opacity="0.03" stroke="#f5f5f5" stroke-opacity="0.30" stroke-width="1"/>
        <text x="568" y="389.5" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Cloudflare DNS</text>
        <text x="568" y="404.5" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">git.sindrg.com</text>
        <!-- node: User -->
        <rect x="488" y="472" width="160" height="48" rx="6" fill="#2d3142"/>
        <rect x="488" y="472" width="160" height="48" rx="6" fill="#bfc0c0" fill-opacity="0.10" stroke="#949eb2" stroke-width="1"/>
        <text x="568" y="500" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">User</text>
