        <text x="260" y="684" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Always running</text>
        <rect x="356" y="676" width="14" height="10" rx="2" fill="#f5f5f5" fill-opacity="0.02" stroke="#f5f5f5" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="376" y="684" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Built on demand</text>
        <rect x="476" y="676" width="14" height="10" rx="2" fill="#f5f5f5" fill-opacity="0.05" stroke="#bfc0c0" stroke-width="1"/>
        <text x="496" y="684" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Bucket</text>
        <line x1="552" y1="681" x2="580" y2="681" stroke="#739fdf" stroke-width="1.2" marker-end="url(#arch-system-arrow-link)"/>
        <text x="588" y="684" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">HTTPS</text>
        <line x1="640" y1="681" x2="668" y2="681" stroke="#bfc0c0" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arch-system-arrow)"/>
        <text x="676" y="684" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">During a recovery</text>
