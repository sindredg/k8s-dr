        <rect x="40" y="676" width="14" height="10" rx="2" fill="#bfc0c0" fill-opacity="0.10" stroke="#949eb2" stroke-width="1"/>
        <text x="60" y="684" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Client</text>
        <rect x="116" y="676" width="14" height="10" rx="2" fill="#f5f5f5" fill-opacity="0.03" stroke="#f5f5f5" stroke-opacity="0.30" stroke-width="1"/>
