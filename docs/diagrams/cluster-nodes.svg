<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 416" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cluster-nodes-title cluster-nodes-desc" id="cluster-nodes-root">
        <title id="cluster-nodes-title">What runs on each node</title>
        <desc id="cluster-nodes-desc">Architecture diagram showing the control-plane VM with the API server and the other control-plane components, and the worker VM with Traefik, the service pods, the controllers, and the data disk that holds every volume, joined by a Calico VXLAN overlay.</desc>
        <defs>
      <style>#cluster-nodes-root { --color-paper:   #2d3142;
      --color-ink:     #f5f5f5;
      --color-muted:   #bfc0c0;
      --color-accent:  #f08a59;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #cluster-nodes-root { font-family: var(--font-sans); color: var(--color-ink); }
      #cluster-nodes-root .diagram-container { width: 100%; overflow-x: auto; }
      #cluster-nodes-root .diagram-container { overflow-x: visible; }</style>
          <marker id="cluster-nodes-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker>
          <marker id="cluster-nodes-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker>
          <marker id="cluster-nodes-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#739fdf"/></marker>
          
        </defs>

        <rect width="100%" height="100%" fill="#2d3142"/>

        <!-- zones -->
        <rect x="40" y="56" width="224" height="264" rx="8" fill="#f5f5f5" fill-opacity="0.03" stroke="#f5f5f5" stroke-opacity="0.20" stroke-width="0.8" stroke-dasharray="4,4"/>
        <rect x="52" y="60" width="200" height="12" rx="2" fill="#2d3142"/>
        <text x="152" y="69" fill="#949eb2" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">CONTROL-PLANE VM · NOSCHEDULE TAINT</text>
        <rect x="424" y="56" width="496" height="264" rx="8" fill="#f5f5f5" fill-opacity="0.03" stroke="#f5f5f5" stroke-opacity="0.20" stroke-width="0.8" stroke-dasharray="4,4"/>
        <rect x="436" y="60" width="196" height="12" rx="2" fill="#2d3142"/>
        <text x="534" y="69" fill="#949eb2" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">WORKER VM · LABEL NODE-ROLE WORKER</text>

        <!-- rules, lifelines and callouts -->
        <text x="64" y="300" fill="#949eb2" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.14em">KUBELET + CONTAINERD</text>
        <text x="448" y="300" fill="#949eb2" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.14em">KUBELET + CONTAINERD</text>

        <!-- connectors (behind nodes) -->
        <path d="M 264,136 L 424,136" fill="none" stroke="#bfc0c0" stroke-width="1.2"/>
        <path d="M 792,152 L 792,208" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#cluster-nodes-arrow)"/>

        <!-- connector labels -->
        <rect x="306" y="116" width="76" height="12" rx="2" fill="#2d3142"/>
        <text x="344" y="125" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">CALICO VXLAN</text>
        <rect x="800" y="174" width="64" height="12" rx="2" fill="#2d3142"/>
        <text x="832" y="183" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">LOCAL PATH</text>

        <!-- nodes -->
        <!-- node: kube-apiserver -->
        <rect x="64" y="88" width="176" height="64" rx="6" fill="#2d3142"/>
        <rect x="64" y="88" width="176" height="64" rx="6" fill="#f08a59" fill-opacity="0.10" stroke="#f08a59" stroke-width="1"/>
        <text x="152" y="117.5" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">kube-apiserver</text>
        <text x="152" y="132.5" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">private address :6443</text>
        <!-- node: Control-plane pods -->
        <rect x="64" y="184" width="176" height="64" rx="6" fill="#2d3142"/>
        <rect x="64" y="184" width="176" height="64" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
        <text x="152" y="207" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Control-plane pods</text>
        <text x="152" y="222" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">etcd · scheduler</text>
        <text x="152" y="235" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">controller manager</text>
        <!-- node: Traefik -->
        <rect x="448" y="88" width="208" height="64" rx="6" fill="#2d3142"/>
        <rect x="448" y="88" width="208" height="64" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
        <text x="552" y="117.5" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Traefik</text>
        <text x="552" y="132.5" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">host ports 80 and 443</text>
        <!-- node: Service pods -->
        <rect x="688" y="88" width="208" height="64" rx="6" fill="#2d3142"/>
        <rect x="688" y="88" width="208" height="64" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
        <text x="792" y="111" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Service pods</text>
        <text x="792" y="126" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Gitea · PostgreSQL</text>
        <text x="792" y="139" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">metrics collector</text>
        <!-- node: Controllers -->
        <rect x="448" y="208" width="208" height="64" rx="6" fill="#2d3142"/>
        <rect x="448" y="208" width="208" height="64" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
        <text x="552" y="231" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Controllers</text>
        <text x="552" y="246" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Flux · cert-manager</text>
        <text x="552" y="259" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">and other controllers</text>
        <!-- node: Data disk -->
        <rect x="688" y="208" width="208" height="64" rx="6" fill="#2d3142"/>
        <rect x="688" y="208" width="208" height="64" rx="6" fill="#f5f5f5" fill-opacity="0.05" stroke="#bfc0c0" stroke-width="1"/>
        <text x="792" y="231" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Data disk</text>
        <text x="792" y="246" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">/var/lib/k8s-dr</text>
        <text x="792" y="259" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">one directory per volume</text>

        <!-- legend strip -->
        <line x1="40" y1="348" x2="920" y2="348" stroke="#f5f5f5" stroke-opacity="0.10" stroke-width="0.8"/>
        <text x="40" y="364" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">LEGEND</text>
        <rect x="40" y="380" width="14" height="10" rx="2" fill="none" stroke="#f5f5f5" stroke-opacity="0.30" stroke-width="0.8" stroke-dasharray="4,4"/>
        <text x="60" y="388" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">VM</text>
        <rect x="96" y="380" width="14" height="10" rx="2" fill="#f08a59" fill-opacity="0.10" stroke="#f08a59" stroke-width="1"/>
        <text x="116" y="388" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Cluster endpoint</text>
        <rect x="220" y="380" width="14" height="10" rx="2" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
        <text x="240" y="388" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Pods</text>
        <rect x="284" y="380" width="14" height="10" rx="2" fill="#f5f5f5" fill-opacity="0.05" stroke="#bfc0c0" stroke-width="1"/>
        <text x="304" y="388" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Disk</text>
        <line x1="348" y1="385" x2="376" y2="385" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#cluster-nodes-arrow)"/>
        <text x="384" y="388" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Volume directory</text>
        <line x1="488" y1="385" x2="516" y2="385" stroke="#bfc0c0" stroke-width="1.2"/>
        <text x="524" y="388" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Pod network between nodes</text>
      </svg>
