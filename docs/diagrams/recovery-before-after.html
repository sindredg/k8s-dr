<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Before and after a regional failure</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #2d3142;
      --color-ink:     #f5f5f5;
      --color-muted:   #bfc0c0;
      --color-accent:  #f08a59;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · k8s-dr</p>
    <h1>Before and after a regional failure</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 496" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="recovery-before-after-title recovery-before-after-desc">
        <title id="recovery-before-after-title">Before and after a regional failure</title>
        <desc id="recovery-before-after-desc">Architecture diagram with two panels: in normal operation users reach the primary in Finland, which backs up to Belgium while no recovery VMs exist; after a failure users reach the recovery cluster in Belgium, restored from the bucket, and the primary is down and fenced.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#739fdf"/></marker>
          
        </defs>

        <rect width="100%" height="100%" fill="#2d3142"/>

        <!-- zones -->
        <rect x="40" y="40" width="400" height="360" rx="8" fill="rgba(245,245,245,0.03)" stroke="rgba(245,245,245,0.20)" stroke-width="0.8" stroke-dasharray="4,4"/>
        <rect x="52" y="44" width="100" height="12" rx="2" fill="#2d3142"/>
        <text x="102" y="53" fill="#949eb2" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">NORMAL OPERATION</text>
        <rect x="520" y="40" width="400" height="360" rx="8" fill="rgba(245,245,245,0.03)" stroke="rgba(245,245,245,0.20)" stroke-width="0.8" stroke-dasharray="4,4"/>
        <rect x="532" y="44" width="140" height="12" rx="2" fill="#2d3142"/>
        <text x="602" y="53" fill="#949eb2" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">AFTER A REGIONAL FAILURE</text>

        <!-- rules, lifelines and callouts -->


        <!-- connectors (behind nodes) -->
        <path d="M 160,216 L 176,216 Q 184,216 184,208 L 184,128 Q 184,120 192,120 L 208,120" fill="none" stroke="#739fdf" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <path d="M 304,152 L 304,196" fill="none" stroke="#f08a59" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <path d="M 640,240 L 656,240 Q 664,240 664,248 L 664,328 Q 664,336 672,336 L 688,336" fill="none" stroke="#739fdf" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <path d="M 736,260 L 736,304" fill="none" stroke="#f08a59" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <path d="M 784,304 L 784,260" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- connector labels -->
        <rect x="312" y="168" width="76" height="12" rx="2" fill="#2d3142"/>
        <text x="350" y="177" fill="#f08a59" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">EVERY 15 MIN</text>
        <rect x="680" y="276" width="48" height="12" rx="2" fill="#2d3142"/>
        <text x="704" y="285" fill="#f08a59" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">RESTORE</text>
        <rect x="792" y="276" width="76" height="12" rx="2" fill="#2d3142"/>
        <text x="830" y="285" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">EVERY 15 MIN</text>

        <!-- nodes -->
        <!-- node: Users -->
        <rect x="56" y="196" width="104" height="64" rx="6" fill="#2d3142"/>
        <rect x="56" y="196" width="104" height="64" rx="6" fill="rgba(191,192,192,0.10)" stroke="#949eb2" stroke-width="1"/>
        <text x="108" y="232" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Users</text>
        <!-- node: Primary -->
        <rect x="208" y="88" width="152" height="64" rx="6" fill="#2d3142"/>
        <rect x="208" y="88" width="152" height="64" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
        <text x="284" y="111" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Primary</text>
        <text x="284" y="126" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Finland</text>
        <text x="284" y="139" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">serving</text>
        <!-- node: Backup bucket -->
        <rect x="208" y="196" width="152" height="64" rx="6" fill="#2d3142"/>
        <rect x="208" y="196" width="152" height="64" rx="6" fill="rgba(245,245,245,0.05)" stroke="#bfc0c0" stroke-width="1"/>
        <text x="284" y="225.5" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Backup bucket</text>
        <text x="284" y="240.5" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Belgium</text>
        <!-- node: Recovery -->
        <rect x="208" y="304" width="152" height="64" rx="6" fill="#2d3142"/>
        <rect x="208" y="304" width="152" height="64" rx="6" fill="rgba(245,245,245,0.02)" stroke="rgba(245,245,245,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="284" y="327" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Recovery</text>
        <text x="284" y="342" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Belgium</text>
        <text x="284" y="355" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">nothing running</text>
        <!-- node: Users -->
        <rect x="536" y="196" width="104" height="64" rx="6" fill="#2d3142"/>
        <rect x="536" y="196" width="104" height="64" rx="6" fill="rgba(191,192,192,0.10)" stroke="#949eb2" stroke-width="1"/>
        <text x="588" y="232" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Users</text>
        <!-- node: Primary -->
        <rect x="688" y="88" width="152" height="64" rx="6" fill="#2d3142"/>
        <rect x="688" y="88" width="152" height="64" rx="6" fill="rgba(245,245,245,0.02)" stroke="rgba(245,245,245,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="764" y="111" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Primary</text>
        <text x="764" y="126" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Finland</text>
        <text x="764" y="139" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">down, fenced</text>
        <!-- node: Backup bucket -->
        <rect x="688" y="196" width="152" height="64" rx="6" fill="#2d3142"/>
        <rect x="688" y="196" width="152" height="64" rx="6" fill="rgba(245,245,245,0.05)" stroke="#bfc0c0" stroke-width="1"/>
        <text x="764" y="225.5" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Backup bucket</text>
        <text x="764" y="240.5" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Belgium</text>
        <!-- node: Recovery -->
        <rect x="688" y="304" width="152" height="64" rx="6" fill="#2d3142"/>
        <rect x="688" y="304" width="152" height="64" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
        <text x="764" y="327" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Recovery</text>
        <text x="764" y="342" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Belgium</text>
        <text x="764" y="355" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">serving</text>

        <!-- legend strip -->
        <line x1="40" y1="428" x2="920" y2="428" stroke="rgba(245,245,245,0.10)" stroke-width="0.8"/>
        <text x="40" y="444" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">LEGEND</text>
        <rect x="40" y="460" width="14" height="10" rx="2" fill="rgba(191,192,192,0.10)" stroke="#949eb2" stroke-width="1"/>
        <text x="60" y="468" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Clients</text>
        <rect x="120" y="460" width="14" height="10" rx="2" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
        <text x="140" y="468" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Serving cluster</text>
        <rect x="240" y="460" width="14" height="10" rx="2" fill="rgba(245,245,245,0.02)" stroke="rgba(245,245,245,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="260" y="468" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Not running</text>
        <rect x="340" y="460" width="14" height="10" rx="2" fill="rgba(245,245,245,0.05)" stroke="#bfc0c0" stroke-width="1"/>
        <text x="360" y="468" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Bucket</text>
        <line x1="416" y1="465" x2="444" y2="465" stroke="#739fdf" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text x="452" y="468" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">User traffic</text>
        <line x1="536" y1="465" x2="564" y2="465" stroke="#f08a59" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="572" y="468" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Backup data</text>
        <line x1="652" y1="465" x2="680" y2="465" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="688" y="468" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Backups, once enabled</text>
      </svg>
    </div>
  </div>
</body>
</html>
