<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 584" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="infra-roots-title infra-roots-desc" id="infra-roots-root">
        <title id="infra-roots-title">Terraform roots and what each one owns</title>
        <desc id="infra-roots-desc">Architecture diagram showing four Terraform roots, bootstrap, shared, primary, and recovery, the resources each creates, the regional cluster module that the primary and recovery roots both call, and the state bucket that holds every root&#x27;s state under its own prefix.</desc>
        <defs>
      <style>#infra-roots-root { --color-paper:   #2d3142;
      --color-ink:     #f5f5f5;
      --color-muted:   #bfc0c0;
      --color-accent:  #f08a59;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #infra-roots-root { font-family: var(--font-sans); color: var(--color-ink); }
      #infra-roots-root .diagram-container { width: 100%; overflow-x: auto; }
      #infra-roots-root .diagram-container { overflow-x: visible; }</style>
          <marker id="infra-roots-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker>
          <marker id="infra-roots-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker>
          <marker id="infra-roots-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#739fdf"/></marker>
          
        </defs>

        <rect width="100%" height="100%" fill="#2d3142"/>

        <!-- zones -->


        <!-- rules, lifelines and callouts -->


        <!-- connectors (behind nodes) -->
        <path d="M 288,76 L 200,76" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#infra-roots-arrow)"/>
        <path d="M 200,104 L 288,104" fill="none" stroke="#bfc0c0" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#infra-roots-arrow)"/>
        <path d="M 200,200 L 288,200" fill="none" stroke="#bfc0c0" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#infra-roots-arrow)"/>
        <path d="M 200,360 L 288,360" fill="none" stroke="#bfc0c0" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#infra-roots-arrow)"/>
        <path d="M 200,456 L 288,456" fill="none" stroke="#bfc0c0" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#infra-roots-arrow)"/>
        <path d="M 464,188 L 524,188 Q 532,188 532,180 L 532,160 Q 532,152 540,152 L 600,152" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#infra-roots-arrow)"/>
        <path d="M 464,212 L 524,212 Q 532,212 532,220 L 532,240 Q 532,248 540,248 L 600,248" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#infra-roots-arrow)"/>
        <path d="M 464,360 L 600,360" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#infra-roots-arrow)"/>
        <path d="M 464,456 L 600,456" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#infra-roots-arrow)"/>

        <!-- connector labels -->
        <rect x="220" y="56" width="48" height="12" rx="2" fill="#2d3142"/>
        <text x="244" y="65" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">CREATES</text>
        <rect x="514" y="340" width="36" height="12" rx="2" fill="#2d3142"/>
        <text x="532" y="349" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">CALLS</text>
        <rect x="514" y="436" width="36" height="12" rx="2" fill="#2d3142"/>
        <text x="532" y="445" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">CALLS</text>

        <!-- nodes -->
        <!-- node: State bucket -->
        <rect x="40" y="56" width="160" height="432" rx="6" fill="#2d3142"/>
        <rect x="40" y="56" width="160" height="432" rx="6" fill="#f5f5f5" fill-opacity="0.05" stroke="#bfc0c0" stroke-width="1"/>
        <text x="120" y="250" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">State bucket</text>
        <text x="120" y="265" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Belgium · europe-west1</text>
        <text x="120" y="278" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">one prefix per root:</text>
        <text x="120" y="291" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">bootstrap · shared</text>
        <text x="120" y="304" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">primary · recovery</text>
        <!-- node: Bootstrap root -->
        <rect x="288" y="56" width="176" height="64" rx="6" fill="#2d3142"/>
        <rect x="288" y="56" width="176" height="64" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
        <text x="376" y="79" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Bootstrap root</text>
        <text x="376" y="94" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">infra/bootstrap</text>
        <text x="376" y="107" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">local state, then migrated</text>
        <!-- node: Shared root -->
        <rect x="288" y="168" width="176" height="64" rx="6" fill="#2d3142"/>
        <rect x="288" y="168" width="176" height="64" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
        <text x="376" y="191" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Shared root</text>
        <text x="376" y="206" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">infra/shared</text>
        <text x="376" y="219" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">outlives any region</text>
        <!-- node: Primary root -->
        <rect x="288" y="328" width="176" height="64" rx="6" fill="#2d3142"/>
        <rect x="288" y="328" width="176" height="64" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
        <text x="376" y="351" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Primary root</text>
        <text x="376" y="366" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">infra/primary</text>
        <text x="376" y="379" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">+ its worker data disk</text>
        <!-- node: Recovery root -->
        <rect x="288" y="424" width="176" height="64" rx="6" fill="#2d3142"/>
        <rect x="288" y="424" width="176" height="64" rx="6" fill="#f5f5f5" fill-opacity="0.02" stroke="#f5f5f5" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="376" y="447" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Recovery root</text>
        <text x="376" y="462" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">infra/recovery</text>
        <text x="376" y="475" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">+ its own data disk</text>
        <!-- node: Backup bucket -->
        <rect x="600" y="120" width="176" height="64" rx="6" fill="#2d3142"/>
        <rect x="600" y="120" width="176" height="64" rx="6" fill="#f5f5f5" fill-opacity="0.05" stroke="#bfc0c0" stroke-width="1"/>
        <text x="688" y="143" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Backup bucket</text>
        <text x="688" y="158" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Belgium · europe-west1</text>
        <text x="688" y="171" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">IAM per cluster prefix</text>
        <!-- node: IAM and uptime check -->
        <rect x="600" y="208" width="176" height="96" rx="6" fill="#2d3142"/>
        <rect x="600" y="208" width="176" height="96" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
        <text x="688" y="231" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">IAM and uptime check</text>
        <text x="688" y="246" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">node and pipeline accounts</text>
        <text x="688" y="259" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">admin: IAP, OS Login,</text>
        <text x="688" y="272" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">instance admin</text>
        <text x="688" y="285" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">age key secrets</text>
        <!-- node: Cluster module -->
        <rect x="600" y="328" width="176" height="160" rx="6" fill="#2d3142"/>
        <rect x="600" y="328" width="176" height="160" rx="6" fill="#f08a59" fill-opacity="0.10" stroke="#f08a59" stroke-width="1"/>
        <text x="688" y="386" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Cluster module</text>
        <text x="688" y="401" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">modules/regional_cluster</text>
        <text x="688" y="414" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">VPC · subnet · NAT</text>
        <text x="688" y="427" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">2 VMs · firewall rules</text>
        <text x="688" y="440" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">load balancer</text>

        <!-- legend strip -->
        <line x1="40" y1="516" x2="920" y2="516" stroke="#f5f5f5" stroke-opacity="0.10" stroke-width="0.8"/>
        <text x="40" y="532" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">LEGEND</text>
        <rect x="40" y="548" width="14" height="10" rx="2" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
        <text x="60" y="556" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Permanent</text>
        <rect x="132" y="548" width="14" height="10" rx="2" fill="#f5f5f5" fill-opacity="0.02" stroke="#f5f5f5" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="152" y="556" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Created for a drill, then destroyed</text>
        <rect x="348" y="548" width="14" height="10" rx="2" fill="#f5f5f5" fill-opacity="0.05" stroke="#bfc0c0" stroke-width="1"/>
        <text x="368" y="556" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Bucket</text>
        <rect x="424" y="548" width="14" height="10" rx="2" fill="#f08a59" fill-opacity="0.10" stroke="#f08a59" stroke-width="1"/>
        <text x="444" y="556" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Shared by both regions</text>
        <line x1="576" y1="553" x2="604" y2="553" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#infra-roots-arrow)"/>
        <text x="612" y="556" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Creates or calls</text>
        <line x1="716" y1="553" x2="744" y2="553" stroke="#bfc0c0" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#infra-roots-arrow)"/>
        <text x="752" y="556" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Holds the state of</text>
      </svg>
