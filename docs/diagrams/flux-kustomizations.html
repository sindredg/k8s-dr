<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Kustomizations and their order</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #2d3142;
      --color-ink:     #f5f5f5;
      --color-muted:   #bfc0c0;
      --color-accent:  #f08a59;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Dependency graph · k8s-dr</p>
    <h1>The Kustomizations and their order</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 416" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flux-kustomizations-title flux-kustomizations-desc">
        <title id="flux-kustomizations-title">The Kustomizations and their order</title>
        <desc id="flux-kustomizations-desc">Dependency diagram showing the five Flux Kustomizations that the root applies on every cluster: certificates waits for infrastructure, gitea waits for certificates and postgresql, and monitoring depends on nothing.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#739fdf"/></marker>
          
        </defs>

        <rect width="100%" height="100%" fill="#2d3142"/>

        <!-- zones -->
        <rect x="40" y="56" width="880" height="264" rx="8" fill="rgba(245,245,245,0.03)" stroke="rgba(245,245,245,0.20)" stroke-width="0.8" stroke-dasharray="4,4"/>
        <rect x="52" y="60" width="436" height="12" rx="2" fill="#2d3142"/>
        <text x="270" y="69" fill="#949eb2" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">ROOT KUSTOMIZATION FLUX-SYSTEM · DEPLOY/CLUSTERS/&lt;CLUSTER&gt; INCLUDES DEPLOY/SYNC</text>

        <!-- rules, lifelines and callouts -->


        <!-- connectors (behind nodes) -->
        <path d="M 248,128 L 392,128" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 568,128 L 712,128" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 568,248 L 792,248 Q 800,248 800,240 L 800,168" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- connector labels -->
        <rect x="286" y="108" width="68" height="12" rx="2" fill="#2d3142"/>
        <text x="320" y="117" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">READY FIRST</text>
        <rect x="606" y="108" width="68" height="12" rx="2" fill="#2d3142"/>
        <text x="640" y="117" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">READY FIRST</text>
        <rect x="650" y="228" width="68" height="12" rx="2" fill="#2d3142"/>
        <text x="684" y="237" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">READY FIRST</text>

        <!-- nodes -->
        <!-- node: infrastructure -->
        <rect x="72" y="88" width="176" height="80" rx="6" fill="#2d3142"/>
        <rect x="72" y="88" width="176" height="80" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
        <rect x="80" y="96" width="88" height="12" rx="2" fill="none" stroke="#f5f5f5" stroke-opacity="0.5" stroke-width="0.8"/>
        <text x="124" y="105" fill="#f5f5f5" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">WAITS FOR HEALTH</text>
        <text x="160" y="127" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">infrastructure</text>
        <text x="160" y="142" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">deploy/infrastructure</text>
        <text x="160" y="155" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">cert-manager · Traefik policy</text>
        <!-- node: certificates -->
        <rect x="392" y="88" width="176" height="80" rx="6" fill="#2d3142"/>
        <rect x="392" y="88" width="176" height="80" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
        <rect x="400" y="96" width="72" height="12" rx="2" fill="none" stroke="#f5f5f5" stroke-opacity="0.5" stroke-width="0.8"/>
        <text x="436" y="105" fill="#f5f5f5" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">DOES NOT WAIT</text>
        <text x="480" y="127" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">certificates</text>
        <text x="480" y="142" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">deploy/certificates</text>
        <text x="480" y="155" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">issuers · token · certs</text>
        <!-- node: gitea -->
        <rect x="712" y="88" width="176" height="80" rx="6" fill="#2d3142"/>
        <rect x="712" y="88" width="176" height="80" rx="6" fill="rgba(240,138,89,0.10)" stroke="#f08a59" stroke-width="1"/>
        <rect x="720" y="96" width="88" height="12" rx="2" fill="none" stroke="#f08a59" stroke-opacity="0.5" stroke-width="0.8"/>
        <text x="764" y="105" fill="#f08a59" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">WAITS FOR HEALTH</text>
        <text x="800" y="127" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">gitea</text>
        <text x="800" y="142" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">deploy/apps/gitea</text>
        <text x="800" y="155" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">release · gateway · backup</text>
        <!-- node: monitoring -->
        <rect x="72" y="208" width="176" height="80" rx="6" fill="#2d3142"/>
        <rect x="72" y="208" width="176" height="80" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
        <rect x="80" y="216" width="72" height="12" rx="2" fill="none" stroke="#f5f5f5" stroke-opacity="0.5" stroke-width="0.8"/>
        <text x="116" y="225" fill="#f5f5f5" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">DOES NOT WAIT</text>
        <text x="160" y="247" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">monitoring</text>
        <text x="160" y="262" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">deploy/monitoring</text>
        <text x="160" y="275" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">nothing depends on it</text>
        <!-- node: postgresql -->
        <rect x="392" y="208" width="176" height="80" rx="6" fill="#2d3142"/>
        <rect x="392" y="208" width="176" height="80" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
        <rect x="400" y="216" width="88" height="12" rx="2" fill="none" stroke="#f5f5f5" stroke-opacity="0.5" stroke-width="0.8"/>
        <text x="444" y="225" fill="#f5f5f5" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">WAITS FOR HEALTH</text>
        <text x="480" y="247" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">postgresql</text>
        <text x="480" y="262" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">deploy/apps/postgresql</text>
        <text x="480" y="275" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">StatefulSet · Service</text>

        <!-- legend strip -->
        <line x1="40" y1="348" x2="920" y2="348" stroke="rgba(245,245,245,0.10)" stroke-width="0.8"/>
        <text x="40" y="364" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">LEGEND</text>
        <rect x="40" y="380" width="14" height="10" rx="2" fill="none" stroke="rgba(245,245,245,0.30)" stroke-width="0.8" stroke-dasharray="4,4"/>
        <text x="60" y="388" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Applied by the root Kustomization</text>
        <rect x="248" y="380" width="14" height="10" rx="2" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
        <text x="268" y="388" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Kustomization</text>
        <rect x="356" y="380" width="14" height="10" rx="2" fill="rgba(240,138,89,0.10)" stroke="#f08a59" stroke-width="1"/>
        <text x="376" y="388" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">The service</text>
        <line x1="456" y1="385" x2="484" y2="385" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="492" y="388" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">dependsOn: the source must be ready before the target is applied</text>
      </svg>
    </div>
  </div>
</body>
</html>
