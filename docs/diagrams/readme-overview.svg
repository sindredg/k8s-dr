<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 472" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="readme-overview-title readme-overview-desc" id="readme-overview-root">
        <title id="readme-overview-title">Primary region, offsite backups, and cold recovery</title>
        <desc id="readme-overview-desc">Architecture diagram showing users reaching the primary cluster in Finland through one DNS name, encrypted backups leaving for a bucket in Belgium every 15 minutes, and a recovery cluster in Belgium that is built from the same Git repository and restored from the bucket.</desc>
        <defs>
      <style>#readme-overview-root { --color-paper:   #2d3142;
      --color-ink:     #f5f5f5;
      --color-muted:   #bfc0c0;
      --color-accent:  #f08a59;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #readme-overview-root { font-family: var(--font-sans); color: var(--color-ink); }
      #readme-overview-root .diagram-container { width: 100%; overflow-x: auto; }
      #readme-overview-root .diagram-container { overflow-x: visible; }</style>
          <marker id="readme-overview-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker>
          <marker id="readme-overview-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker>
          <marker id="readme-overview-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#739fdf"/></marker>
          
        </defs>

