<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ways in</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #2d3142;
      --color-ink:     #f5f5f5;
      --color-muted:   #bfc0c0;
      --color-accent:  #f08a59;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · k8s-dr</p>
    <h1>Ways in</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 456" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="access-paths-title access-paths-desc">
        <title id="access-paths-title">Ways in</title>
        <desc id="access-paths-desc">Architecture diagram showing the ways into the system: anyone reaches only Gitea&#x27;s sign-in over HTTPS, while the operator changes the cluster either through Google Cloud, IAP SSH, and kubectl on the nodes, or through the main branch on GitHub, which Flux applies and from which the recovery, return, drill, and watchdog workflows sign in to Google Cloud.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#739fdf"/></marker>
          
        </defs>

        <rect width="100%" height="100%" fill="#2d3142"/>

        <!-- zones -->


        <!-- rules, lifelines and callouts -->


        <!-- connectors (behind nodes) -->
        <path d="M 168,88 L 776,88" fill="none" stroke="#739fdf" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <path d="M 168,252 L 208,252 Q 216,252 216,244 L 216,208 Q 216,200 224,200 L 312,200" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 168,276 L 208,276 Q 216,276 216,284 L 216,320 Q 216,328 224,328 L 312,328" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 488,200 L 576,200" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 736,200 L 840,200 Q 848,200 848,208 L 848,232" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 488,328 L 840,328 Q 848,328 848,320 L 848,296" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 400,296 L 400,232" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- connector labels -->
        <rect x="454" y="68" width="36" height="12" rx="2" fill="#2d3142"/>
        <text x="472" y="77" fill="#739fdf" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">HTTPS</text>
        <rect x="220" y="180" width="88" height="12" rx="2" fill="#2d3142"/>
        <text x="264" y="189" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">GOOGLE ACCOUNT</text>
        <rect x="220" y="336" width="88" height="12" rx="2" fill="#2d3142"/>
        <text x="264" y="345" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">GITHUB ACCOUNT</text>
        <rect x="498" y="180" width="68" height="12" rx="2" fill="#2d3142"/>
        <text x="532" y="189" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">SSH VIA IAP</text>
        <rect x="760" y="180" width="48" height="12" rx="2" fill="#2d3142"/>
        <text x="784" y="189" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">KUBECTL</text>
        <rect x="416" y="258" width="56" height="12" rx="2" fill="#2d3142"/>
        <text x="444" y="267" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">WORKFLOWS</text>
        <rect x="630" y="308" width="76" height="12" rx="2" fill="#2d3142"/>
        <text x="668" y="317" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">FLUX APPLIES</text>

        <!-- nodes -->
        <!-- node: Anyone -->
        <rect x="40" y="56" width="128" height="64" rx="6" fill="#2d3142"/>
        <rect x="40" y="56" width="128" height="64" rx="6" fill="rgba(191,192,192,0.10)" stroke="#949eb2" stroke-width="1"/>
        <text x="104" y="85.5" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Anyone</text>
        <text x="104" y="100.5" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">the internet</text>
        <!-- node: Gitea -->
        <rect x="776" y="56" width="144" height="64" rx="6" fill="#2d3142"/>
        <rect x="776" y="56" width="144" height="64" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
        <text x="848" y="79" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Gitea</text>
        <text x="848" y="94" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">sign-in required</text>
        <text x="848" y="107" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">registration off</text>
        <!-- node: Operator -->
        <rect x="40" y="232" width="128" height="64" rx="6" fill="#2d3142"/>
        <rect x="40" y="232" width="128" height="64" rx="6" fill="rgba(191,192,192,0.10)" stroke="#949eb2" stroke-width="1"/>
        <text x="104" y="261.5" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Operator</text>
        <text x="104" y="276.5" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">two accounts</text>
        <!-- node: Google Cloud -->
        <rect x="312" y="168" width="176" height="64" rx="6" fill="#2d3142"/>
        <rect x="312" y="168" width="176" height="64" rx="6" fill="rgba(245,245,245,0.03)" stroke="rgba(245,245,245,0.30)" stroke-width="1"/>
        <text x="400" y="191" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Google Cloud</text>
        <text x="400" y="206" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Terraform · IAP</text>
        <text x="400" y="219" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">OS Login</text>
        <!-- node: main branch -->
        <rect x="312" y="296" width="176" height="64" rx="6" fill="#2d3142"/>
        <rect x="312" y="296" width="176" height="64" rx="6" fill="rgba(245,245,245,0.03)" stroke="rgba(245,245,245,0.30)" stroke-width="1"/>
        <text x="400" y="319" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">main branch</text>
        <text x="400" y="334" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">GitHub</text>
        <text x="400" y="347" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">pull request required</text>
        <!-- node: Nodes -->
        <rect x="576" y="168" width="160" height="64" rx="6" fill="#2d3142"/>
        <rect x="576" y="168" width="160" height="64" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
        <text x="656" y="191" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Nodes</text>
        <text x="656" y="206" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">sudo on both nodes</text>
        <text x="656" y="219" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">kubectl, admin.conf</text>
        <!-- node: Cluster state -->
        <rect x="776" y="232" width="144" height="64" rx="6" fill="#2d3142"/>
        <rect x="776" y="232" width="144" height="64" rx="6" fill="rgba(240,138,89,0.10)" stroke="#f08a59" stroke-width="1"/>
        <text x="848" y="261.5" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Cluster state</text>
        <text x="848" y="276.5" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">everything deployed</text>

        <!-- legend strip -->
        <line x1="40" y1="388" x2="920" y2="388" stroke="rgba(245,245,245,0.10)" stroke-width="0.8"/>
        <text x="40" y="404" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">LEGEND</text>
        <rect x="40" y="420" width="14" height="10" rx="2" fill="rgba(191,192,192,0.10)" stroke="#949eb2" stroke-width="1"/>
        <text x="60" y="428" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Person</text>
        <rect x="116" y="420" width="14" height="10" rx="2" fill="rgba(245,245,245,0.03)" stroke="rgba(245,245,245,0.30)" stroke-width="1"/>
        <text x="136" y="428" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Account boundary</text>
        <rect x="240" y="420" width="14" height="10" rx="2" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
        <text x="260" y="428" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">In the project</text>
        <rect x="356" y="420" width="14" height="10" rx="2" fill="rgba(240,138,89,0.10)" stroke="#f08a59" stroke-width="1"/>
        <text x="376" y="428" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">What both paths change</text>
        <line x1="508" y1="425" x2="536" y2="425" stroke="#739fdf" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text x="544" y="428" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Public</text>
        <line x1="600" y1="425" x2="628" y2="425" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="636" y="428" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Administrative path</text>
      </svg>
    </div>
  </div>
</body>
</html>
