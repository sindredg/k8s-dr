<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How a playbook run reaches the nodes</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #2d3142;
      --color-ink:     #f5f5f5;
      --color-muted:   #bfc0c0;
      --color-accent:  #f08a59;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · k8s-dr</p>
    <h1>How a playbook run reaches the nodes</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 576" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ansible-iap-title ansible-iap-desc">
        <title id="ansible-iap-title">How a playbook run reaches the nodes</title>
        <desc id="ansible-iap-desc">Sequence diagram showing the operator machine opening one IAP tunnel per node, scanning host keys through the tunnels, running the playbook over SSH with strict host key checking, and closing the tunnels.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#739fdf"/></marker>
          
        </defs>

        <rect width="100%" height="100%" fill="#2d3142"/>

        <!-- zones -->


        <!-- rules, lifelines and callouts -->
        <line x1="112" y1="96" x2="112" y2="480" stroke="rgba(245,245,245,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="480" y1="96" x2="480" y2="480" stroke="rgba(245,245,245,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="848" y1="96" x2="848" y2="480" stroke="rgba(245,245,245,0.22)" stroke-width="1" stroke-dasharray="3,3"/>

        <!-- connectors (behind nodes) -->
        <path d="M 112,140 L 140,140 Q 148,140 148,148 L 148,160 Q 148,168 140,168 L 112,168" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 112,208 L 480,208" fill="none" stroke="#739fdf" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <path d="M 480,252 L 848,252" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 112,296 L 848,296" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 112,340 L 140,340 Q 148,340 148,348 L 148,360 Q 148,368 140,368 L 112,368" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 112,408 L 848,408" fill="none" stroke="#f08a59" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <path d="M 112,452 L 480,452" fill="none" stroke="#bfc0c0" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

        <!-- connector labels -->
        <rect x="156" y="148" width="216" height="12" rx="2" fill="#2d3142"/>
        <text x="264" y="157" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">MAKE INVENTORY: READ TERRAFORM OUTPUTS</text>
        <rect x="166" y="188" width="260" height="12" rx="2" fill="#2d3142"/>
        <text x="296" y="197" fill="#739fdf" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">OPEN A TUNNEL PER NODE · 127.0.0.1:2201, :2202</text>
        <rect x="610" y="232" width="108" height="12" rx="2" fill="#2d3142"/>
        <text x="664" y="241" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">FORWARD TO PORT 22</text>
        <rect x="206" y="276" width="180" height="12" rx="2" fill="#2d3142"/>
        <text x="296" y="285" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">SSH-KEYSCAN THROUGH EACH TUNNEL</text>
        <rect x="156" y="348" width="184" height="12" rx="2" fill="#2d3142"/>
        <text x="248" y="357" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">WRITE A PRIVATE KNOWN_HOSTS FILE</text>
        <rect x="172" y="388" width="248" height="12" rx="2" fill="#2d3142"/>
        <text x="296" y="397" fill="#f08a59" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">ANSIBLE-PLAYBOOK OVER SSH · STRICT HOST KEYS</text>
        <rect x="224" y="432" width="144" height="12" rx="2" fill="#2d3142"/>
        <text x="296" y="441" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">CLOSE THE TUNNELS, ALWAYS</text>

        <!-- nodes -->
        <!-- node: Operator machine -->
        <rect x="40" y="40" width="144" height="56" rx="6" fill="#2d3142"/>
        <rect x="40" y="40" width="144" height="56" rx="6" fill="rgba(191,192,192,0.10)" stroke="#949eb2" stroke-width="1"/>
        <text x="112" y="65.5" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Operator machine</text>
        <text x="112" y="80.5" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">scripts/run_with_iap.py</text>
        <!-- node: Google IAP -->
        <rect x="408" y="40" width="144" height="56" rx="6" fill="#2d3142"/>
        <rect x="408" y="40" width="144" height="56" rx="6" fill="rgba(245,245,245,0.03)" stroke="rgba(245,245,245,0.30)" stroke-width="1"/>
        <text x="480" y="65.5" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Google IAP</text>
        <text x="480" y="80.5" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">gcloud start-iap-tunnel</text>
        <!-- node: Nodes -->
        <rect x="776" y="40" width="144" height="56" rx="6" fill="#2d3142"/>
        <rect x="776" y="40" width="144" height="56" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
        <text x="848" y="65.5" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Nodes</text>
        <text x="848" y="80.5" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">no public address</text>

        <!-- legend strip -->
        <line x1="40" y1="508" x2="920" y2="508" stroke="rgba(245,245,245,0.10)" stroke-width="0.8"/>
        <text x="40" y="524" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">LEGEND</text>
        <rect x="40" y="540" width="14" height="10" rx="2" fill="rgba(191,192,192,0.10)" stroke="#949eb2" stroke-width="1"/>
        <text x="60" y="548" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Operator</text>
        <rect x="124" y="540" width="14" height="10" rx="2" fill="rgba(245,245,245,0.03)" stroke="rgba(245,245,245,0.30)" stroke-width="1"/>
        <text x="144" y="548" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Google service</text>
        <rect x="240" y="540" width="14" height="10" rx="2" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
        <text x="260" y="548" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Cluster VMs</text>
        <line x1="340" y1="545" x2="368" y2="545" stroke="#739fdf" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text x="376" y="548" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Call to Google</text>
        <line x1="472" y1="545" x2="500" y2="545" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="508" y="548" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Step</text>
        <line x1="552" y1="545" x2="580" y2="545" stroke="#f08a59" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="588" y="548" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">The playbook run</text>
        <line x1="692" y1="545" x2="720" y2="545" stroke="#bfc0c0" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <text x="728" y="548" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Cleanup</text>
      </svg>
    </div>
  </div>
</body>
</html>
