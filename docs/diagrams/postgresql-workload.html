<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The PostgreSQL workload</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #2d3142;
      --color-ink:     #f5f5f5;
      --color-muted:   #bfc0c0;
      --color-accent:  #f08a59;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · k8s-dr</p>
    <h1>The PostgreSQL workload</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 424" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="postgresql-workload-title postgresql-workload-desc">
        <title id="postgresql-workload-title">The PostgreSQL workload</title>
        <desc id="postgresql-workload-desc">Architecture diagram showing Gitea and the backup and restore Job connecting to the postgresql Service on port 5432, which fronts the single pod postgresql-0, its credentials Secret, and its 10 GiB claim on the worker data disk.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#739fdf"/></marker>
          
        </defs>

        <rect width="100%" height="100%" fill="#2d3142"/>

        <!-- zones -->


        <!-- rules, lifelines and callouts -->


        <!-- connectors (behind nodes) -->
        <path d="M 200,104 L 224,104 Q 232,104 232,112 L 232,148 Q 232,156 240,156 L 312,156" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 200,232 L 224,232 Q 232,232 232,224 L 232,188 Q 232,180 240,180 L 312,180" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 472,168 L 536,168" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 696,168 L 760,168" fill="none" stroke="#bfc0c0" stroke-width="1.2"/>
        <path d="M 840,200 L 840,264" fill="none" stroke="#bfc0c0" stroke-width="1.2"/>
        <path d="M 616,264 L 616,200" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- connector labels -->
        <rect x="246" y="136" width="52" height="12" rx="2" fill="#2d3142"/>
        <text x="272" y="145" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">TCP 5432</text>
        <rect x="246" y="188" width="52" height="12" rx="2" fill="#2d3142"/>
        <text x="272" y="197" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">TCP 5432</text>

        <!-- nodes -->
        <!-- node: Gitea -->
        <rect x="40" y="72" width="160" height="64" rx="6" fill="#2d3142"/>
        <rect x="40" y="72" width="160" height="64" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
        <text x="120" y="101.5" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Gitea</text>
        <text x="120" y="116.5" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">namespace gitea</text>
        <!-- node: Backup, restore Job -->
        <rect x="40" y="200" width="160" height="64" rx="6" fill="#2d3142"/>
        <rect x="40" y="200" width="160" height="64" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
        <text x="120" y="229.5" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Backup, restore Job</text>
        <text x="120" y="244.5" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">namespace gitea</text>
        <!-- node: Service postgresql -->
        <rect x="312" y="136" width="160" height="64" rx="6" fill="#2d3142"/>
        <rect x="312" y="136" width="160" height="64" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
        <text x="392" y="159" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Service postgresql</text>
        <text x="392" y="174" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">ClusterIP :5432</text>
        <text x="392" y="187" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">postgresql.postgresql.svc</text>
        <!-- node: Pod postgresql-0 -->
        <rect x="536" y="136" width="160" height="64" rx="6" fill="#2d3142"/>
        <rect x="536" y="136" width="160" height="64" rx="6" fill="rgba(240,138,89,0.10)" stroke="#f08a59" stroke-width="1"/>
        <text x="616" y="159" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Pod postgresql-0</text>
        <text x="616" y="174" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">postgres:18.6-trixie</text>
        <text x="616" y="187" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">non-root user 999</text>
        <!-- node: data-postgresql-0 -->
        <rect x="760" y="136" width="160" height="64" rx="6" fill="#2d3142"/>
        <rect x="760" y="136" width="160" height="64" rx="6" fill="rgba(245,245,245,0.05)" stroke="#bfc0c0" stroke-width="1"/>
        <text x="840" y="159" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">data-postgresql-0</text>
        <text x="840" y="174" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">claim · 10 GiB</text>
        <text x="840" y="187" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">local-path</text>
        <!-- node: Worker data disk -->
        <rect x="760" y="264" width="160" height="64" rx="6" fill="#2d3142"/>
        <rect x="760" y="264" width="160" height="64" rx="6" fill="rgba(245,245,245,0.05)" stroke="#bfc0c0" stroke-width="1"/>
        <text x="840" y="293.5" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Worker data disk</text>
        <text x="840" y="308.5" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">not the boot disk</text>
        <!-- node: Secret -->
        <rect x="536" y="264" width="160" height="64" rx="6" fill="#2d3142"/>
        <rect x="536" y="264" width="160" height="64" rx="6" fill="rgba(245,245,245,0.05)" stroke="#bfc0c0" stroke-width="1"/>
        <text x="616" y="287" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Secret</text>
        <text x="616" y="302" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">postgresql-credentials</text>
        <text x="616" y="315" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">from a SOPS file</text>

        <!-- legend strip -->
        <line x1="40" y1="356" x2="920" y2="356" stroke="rgba(245,245,245,0.10)" stroke-width="0.8"/>
        <text x="40" y="372" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">LEGEND</text>
        <rect x="40" y="388" width="14" height="10" rx="2" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
        <text x="60" y="396" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Client or Service</text>
        <rect x="168" y="388" width="14" height="10" rx="2" fill="rgba(240,138,89,0.10)" stroke="#f08a59" stroke-width="1"/>
        <text x="188" y="396" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">The database pod</text>
        <rect x="292" y="388" width="14" height="10" rx="2" fill="rgba(245,245,245,0.05)" stroke="#bfc0c0" stroke-width="1"/>
        <text x="312" y="396" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Storage or secret</text>
        <line x1="420" y1="393" x2="448" y2="393" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="456" y="396" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Connects or feeds</text>
        <line x1="564" y1="393" x2="592" y2="393" stroke="#bfc0c0" stroke-width="1.2"/>
        <text x="600" y="396" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Volume</text>
      </svg>
    </div>
  </div>
</body>
</html>
