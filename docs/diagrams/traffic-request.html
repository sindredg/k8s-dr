<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The request path</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #2d3142;
      --color-ink:     #f5f5f5;
      --color-muted:   #bfc0c0;
      --color-accent:  #f08a59;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · k8s-dr</p>
    <h1>The request path</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="traffic-request-title traffic-request-desc">
        <title id="traffic-request-title">The request path</title>
        <desc id="traffic-request-desc">Sequence diagram showing a request for git.sindrg.com: Cloudflare DNS answers with the serving cluster&#x27;s static address, the passthrough load balancer forwards TCP 443 to Traefik on the worker, Traefik ends TLS and forwards HTTP to Gitea, and Gitea queries PostgreSQL before responding.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#739fdf"/></marker>
          
        </defs>

        <rect width="100%" height="100%" fill="#2d3142"/>

        <!-- zones -->


        <!-- rules, lifelines and callouts -->
        <line x1="112" y1="96" x2="112" y2="524" stroke="rgba(245,245,245,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="296" y1="96" x2="296" y2="524" stroke="rgba(245,245,245,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="480" y1="96" x2="480" y2="524" stroke="rgba(245,245,245,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="664" y1="96" x2="664" y2="524" stroke="rgba(245,245,245,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="848" y1="96" x2="848" y2="524" stroke="rgba(245,245,245,0.22)" stroke-width="1" stroke-dasharray="3,3"/>

        <!-- connectors (behind nodes) -->
        <path d="M 112,140 L 296,140" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 296,184 L 112,184" fill="none" stroke="#bfc0c0" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <path d="M 112,228 L 480,228" fill="none" stroke="#739fdf" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <path d="M 480,272 L 664,272" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 664,316 L 692,316 Q 700,316 700,324 L 700,336 Q 700,344 692,344 L 664,344" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 664,384 L 848,384" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 848,428 L 820,428 Q 812,428 812,436 L 812,448 Q 812,456 820,456 L 848,456" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 848,496 L 112,496" fill="none" stroke="#f08a59" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>

        <!-- connector labels -->
        <rect x="140" y="120" width="128" height="12" rx="2" fill="#2d3142"/>
        <text x="204" y="129" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">RESOLVE GIT.SINDRG.COM</text>
        <rect x="160" y="164" width="88" height="12" rx="2" fill="#2d3142"/>
        <text x="204" y="173" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">STATIC ADDRESS</text>
        <rect x="180" y="208" width="48" height="12" rx="2" fill="#2d3142"/>
        <text x="204" y="217" fill="#739fdf" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">TCP 443</text>
        <rect x="508" y="252" width="128" height="12" rx="2" fill="#2d3142"/>
        <text x="572" y="261" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">PASSTHROUGH, UNCHANGED</text>
        <rect x="708" y="324" width="128" height="12" rx="2" fill="#2d3142"/>
        <text x="772" y="333" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">END TLS, ROUTE BY HOST</text>
        <rect x="708" y="364" width="96" height="12" rx="2" fill="#2d3142"/>
        <text x="756" y="373" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">HTTP · PORT 3000</text>
        <rect x="680" y="436" width="124" height="12" rx="2" fill="#2d3142"/>
        <text x="742" y="445" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">SQL · POSTGRESQL:5432</text>
        <rect x="730" y="476" width="52" height="12" rx="2" fill="#2d3142"/>
        <text x="756" y="485" fill="#f08a59" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">RESPONSE</text>

        <!-- nodes -->
        <!-- node: User -->
        <rect x="40" y="40" width="144" height="56" rx="6" fill="#2d3142"/>
        <rect x="40" y="40" width="144" height="56" rx="6" fill="rgba(191,192,192,0.10)" stroke="#949eb2" stroke-width="1"/>
        <text x="112" y="65.5" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">User</text>
        <text x="112" y="80.5" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">browser or git</text>
        <!-- node: Cloudflare DNS -->
        <rect x="224" y="40" width="144" height="56" rx="6" fill="#2d3142"/>
        <rect x="224" y="40" width="144" height="56" rx="6" fill="rgba(245,245,245,0.03)" stroke="rgba(245,245,245,0.30)" stroke-width="1"/>
        <text x="296" y="65.5" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Cloudflare DNS</text>
        <text x="296" y="80.5" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">DNS only · TTL 60 s</text>
        <!-- node: Load balancer -->
        <rect x="408" y="40" width="144" height="56" rx="6" fill="#2d3142"/>
        <rect x="408" y="40" width="144" height="56" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
        <text x="480" y="65.5" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Load balancer</text>
        <text x="480" y="80.5" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">regional passthrough</text>
        <!-- node: Traefik -->
        <rect x="592" y="40" width="144" height="56" rx="6" fill="#2d3142"/>
        <rect x="592" y="40" width="144" height="56" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
        <text x="664" y="65.5" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Traefik</text>
        <text x="664" y="80.5" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">host ports 80, 443</text>
        <!-- node: Gitea -->
        <rect x="776" y="40" width="144" height="56" rx="6" fill="#2d3142"/>
        <rect x="776" y="40" width="144" height="56" rx="6" fill="rgba(240,138,89,0.10)" stroke="#f08a59" stroke-width="1"/>
        <text x="848" y="65.5" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Gitea</text>
        <text x="848" y="80.5" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">gitea-http:3000</text>

        <!-- legend strip -->
        <line x1="40" y1="552" x2="920" y2="552" stroke="rgba(245,245,245,0.10)" stroke-width="0.8"/>
        <text x="40" y="568" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">LEGEND</text>
        <rect x="40" y="584" width="14" height="10" rx="2" fill="rgba(191,192,192,0.10)" stroke="#949eb2" stroke-width="1"/>
        <text x="60" y="592" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Client</text>
        <rect x="116" y="584" width="14" height="10" rx="2" fill="rgba(245,245,245,0.03)" stroke="rgba(245,245,245,0.30)" stroke-width="1"/>
        <text x="136" y="592" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">External service</text>
        <rect x="240" y="584" width="14" height="10" rx="2" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
        <text x="260" y="592" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Infrastructure</text>
        <rect x="356" y="584" width="14" height="10" rx="2" fill="rgba(240,138,89,0.10)" stroke="#f08a59" stroke-width="1"/>
        <text x="376" y="592" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">The service</text>
        <line x1="456" y1="589" x2="484" y2="589" stroke="#739fdf" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text x="492" y="592" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Public TLS</text>
        <line x1="568" y1="589" x2="596" y2="589" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="604" y="592" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Call</text>
        <line x1="648" y1="589" x2="676" y2="589" stroke="#bfc0c0" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <text x="684" y="592" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Reply</text>
        <line x1="736" y1="589" x2="764" y2="589" stroke="#f08a59" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>
        <text x="772" y="592" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Response</text>
      </svg>
    </div>
  </div>
</body>
</html>
